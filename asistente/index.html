<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Pipe Bot · Asistente interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Pipe Bot interno: chat para consultar rápido juegos, precios, stock, envíos, cuotas y plataformas.
   Responde con los mismos datos del catálogo (stock en vivo), las tarifas de envío y las fórmulas de las calculadoras.
   Identidad del Centro de Mando: negro, grafito metálico, plata y blanco. Tema oscuro fijo por marca. */
:root {
  --bg: #08080a; --surface: #141416; --surface2: #202024; --line: rgba(255,255,255,0.10); --line2: rgba(255,255,255,0.22);
  --text: #f4f4f5; --muted: #9a9aa2; --plata: #d6d6da; --ok: #3ecf8e; --err: #ff7b7b; --warn: #f5c400;
  --metal: linear-gradient(180deg, #2c2c31 0%, #151518 55%, #0e0e10 100%);
  --display: 'Russo One', 'Arial Black', Impact, sans-serif; --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); color: var(--text); margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-width: 860px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
header img { width: 42px; height: 42px; border-radius: 50%; box-shadow: 0 0 0 2px var(--line2); }
header h1 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; line-height: 1.05; }
header p { margin: 0; color: var(--muted); font-size: 13px; }
header .esp { flex: 1; }
header a, header button { white-space: nowrap; font: 600 13px/1 var(--body); color: var(--text); background: transparent; border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; cursor: pointer; text-decoration: none; }
#chat { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 10px 13px; border-radius: 14px; min-width: 0; overflow-wrap: anywhere; }
.yo { align-self: flex-end; background: #2b2b31; border-bottom-right-radius: 4px; }
.bot { align-self: flex-start; background: var(--metal); border: 1px solid var(--line); border-bottom-left-radius: 4px; display: grid; gap: 8px; }
.bot h3 { font-family: var(--display); font-weight: 400; font-size: 16px; margin: 0; }
.bot p { margin: 0; }
.bot .nota { color: var(--muted); font-size: 13px; }
.prod { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.prod:first-of-type { border-top: 0; }
.prod b { font-weight: 700; }
.prod .pr { font-family: var(--display); font-size: 17px; text-align: right; font-variant-numeric: tabular-nums; }
.prod .sub { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: 1px; }
.chip.ok { background: rgba(62,207,142,.15); color: var(--ok); } .chip.no { background: rgba(255,123,123,.14); color: var(--err); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td { padding: 4px 0; border-top: 1px solid var(--line); }
td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.bot a { color: var(--plata); }
.sug { display: flex; gap: 8px; flex-wrap: wrap; }
.sug button { font: 500 13px/1.2 var(--body); color: var(--text); background: #0c0c0e; border: 1px solid var(--line2); border-radius: 999px; padding: 7px 11px; cursor: pointer; }
form#f { display: flex; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); background: var(--bg); }
#q { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--text); background: var(--surface2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; }
form#f button { font: 400 15px/1 var(--display); background: var(--plata); color: #0a0a0c; border: 0; border-radius: 12px; padding: 0 16px; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--plata); outline-offset: 1px; }
.login { max-width: 400px; margin: 10vh auto 0; display: grid; gap: 12px; padding: 0 16px; }
.login label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.login input { font: inherit; font-size: 16px; color: var(--text); background: var(--surface2); border: 1px solid var(--line2); border-radius: 10px; padding: 11px 12px; text-transform: none; letter-spacing: normal; }
.login button { font: 400 16px/1 var(--display); background: var(--plata); color: #0a0a0c; border: 0; border-radius: 10px; padding: 14px; cursor: pointer; }
.err { color: var(--err); font-size: 13px; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>

<form class="login" id="vLogin" hidden>
  <h1 style="font-family:var(--display);font-weight:400;margin:0">Pipe Bot</h1>
  <p style="color:var(--muted);margin:0">Entra con tu correo y contraseña de administrador de Pipe Games.</p>
  <label>Correo<input id="lCorreo" type="email" autocomplete="username" required></label>
  <label>Contraseña<input id="lClave" type="password" autocomplete="current-password" required></label>
  <button type="submit" id="lEntrar">Entrar</button>
  <p class="err" id="lError" role="alert"></p>
</form>

<div class="app" id="vApp" hidden>
  <header>
    <img src="../mensajeria/logo-pipegames.jpg" alt="">
    <div><h1>Pipe Bot</h1><p id="estado">Cargando catálogo y stock…</p></div>
    <span class="esp"></span>
    <a href="../inicio/" title="Centro de Mando">Inicio</a>
    <button type="button" id="salir">Salir</button>
  </header>
  <div id="chat" aria-live="polite"></div>
  <form id="f" autocomplete="off">
    <input id="q" placeholder="Pregunta: mario kart switch, envío a Pasto, Addi 180000…" enterkeyhint="send">
    <button type="submit">Enviar</button>
  </form>
</div>

<script type="module">
import { firebaseConfig, ADMIN_UID, FIREBASE_VERSION } from "../mensajeria/config.js";
import { cargar as cargarMotor, responder, desactualizado, disponibles } from "./motor.js";
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`);
const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function cargar() { await cargarMotor(); $("estado").textContent = `${disponibles()} productos disponibles · stock al día`; }
// ── Chat ──
const SUG = ["mario kart switch", "envío a Medellín", "mario kart switch envío Pasto con Addi", "Addi 180000", "mercado libre 110000", "horario"];
function poner(html, quien) { const d = document.createElement("div"); d.className = "msg " + quien; d.innerHTML = html; $("chat").append(d); $("chat").scrollTop = $("chat").scrollHeight; return d; }
function bienvenida() {
  poner(`<h3>Hola, Felipe 👋</h3><p>Pregúntame por un juego (precio, stock y cuotas), el envío a cualquier municipio, el total con Addi o Sistecrédito, o el precio para publicar en Mercado Libre, Falabella o Éxito.</p>
    <div class="sug">${SUG.map(s => `<button type="button" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>`, "bot");
}
async function preguntar(q) {
  q = q.trim(); if (!q) return;
  poner(esc(q), "yo");
  if (desactualizado()) await cargar();
  poner(responder(q), "bot");
}
$("f").addEventListener("submit", e => { e.preventDefault(); const q = $("q").value; $("q").value = ""; preguntar(q); });
$("chat").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b) preguntar(b.dataset.s); });
window.__pipeBot = { responder, cargar };

// ── Acceso: solo la cuenta de administrador ──
$("vLogin").addEventListener("submit", async ev => {
  ev.preventDefault(); $("lError").textContent = ""; $("lEntrar").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("lCorreo").value.trim(), $("lClave").value); }
  catch { $("lError").textContent = "Correo o contraseña incorrectos."; }
  $("lEntrar").disabled = false;
});
$("salir").onclick = () => signOut(auth);
let iniciado = false;
onAuthStateChanged(auth, async u => {
  if (u && u.uid !== ADMIN_UID) { await signOut(auth); $("lError").textContent = "Esta cuenta no tiene acceso a Pipe Bot."; return; }
  $("vLogin").hidden = !!u; $("vApp").hidden = !u;
  if (!u) { $("lCorreo").focus(); return; }
  if (!iniciado) { iniciado = true; await cargar(); bienvenida(); }
  $("q").focus();
});
</script>
</body>
</html>
