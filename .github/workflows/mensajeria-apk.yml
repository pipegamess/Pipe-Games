name: Compilar app del mensajero

on:
  push:
    branches: [main]
    paths:
      - "mensajeria/app/**"
      - "mensajeria/config.js"
      - "mensajeria/comun.js"
      - "mensajeria/estilos.css"
      - ".github/workflows/mensajeria-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar archivos web
        working-directory: mensajeria/app
        run: cp ../config.js ../comun.js ../estilos.css www/

      - name: Instalar dependencias
        working-directory: mensajeria/app
        run: |
          npm install --no-audit --no-fund
          cp node_modules/@capacitor/core/dist/capacitor.js www/

      - name: Crear proyecto Android
        working-directory: mensajeria/app
        run: |
          npx cap add android
          node scripts/parche-android.js
          npx cap sync android

      - name: Compilar APK
        working-directory: mensajeria/app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../../mensajeria-prueba.apk

      - name: Verificar firma
        run: |
          keytool -printcert -jarfile mensajeria-prueba.apk | tee firma.txt
          grep -q "7C:7A:25:CB:AC:FF:9E:C9:D6:69:09:A2:B7:C0:66:77:C4:DD:48:84:6F:A5:7F:3F:84:10:BC:4C:1F:E0:F0:5E" firma.txt

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mensajero-v1.0.${{ github.run_number }}
          name: App del mensajero 1.0.${{ github.run_number }}
          body: Descarga mensajeria-prueba.apk e instálalo en el celular del mensajero.
          files: mensajeria-prueba.apk
          make_latest: true
