name: Limpiar etiquetas antiguas (una sola vez)

# Mueve dos etiquetas de versión de la app a la historia ya limpia del repositorio.
# Se borra después de correr.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/limpiar-etiquetas.yml"

permissions:
  contents: write

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git tag -f mensajero-v1.0.42 a2f23f62830dc40c10efffb251e09c662b98af7f
          git tag -f mensajero-v1.0.43 9d2c8c971f86f38c42fa5ead80630427fa2897db
          git push -f origin refs/tags/mensajero-v1.0.42 refs/tags/mensajero-v1.0.43
