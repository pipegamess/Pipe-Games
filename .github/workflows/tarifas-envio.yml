name: Tarifas de envío para la mensajería

# Cuando cambian el catálogo o el stock:
#  - copia tarifas y productos del catálogo a la mensajería (tarifas-envio.js, productos-catalogo.js)
#  - genera catalogo-meta.csv (lista de productos para el catálogo de WhatsApp/Meta, con disponibilidad del stock)
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "stock.json"
      - "mensajeria/scripts/extraer-tarifas.js"
      - "mensajeria/scripts/catalogo-meta.js"
      - "mensajeria/scripts/aplicar-llegados.js"
      - "mensajeria/scripts/fechas-llegada.js"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: datos-catalogo
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      # Genera y guarda. Si mientras tanto llegó otro push (por ejemplo el Excel subió stock varias veces seguidas),
      # no se mezcla: se toma la versión más nueva del repositorio y se vuelve a generar todo desde ahí.
      - name: Generar y guardar si cambió
        id: guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            if [ "$i" -gt 1 ]; then
              sleep $((i * 5))
              git fetch -q --no-tags origin main && git reset -q --hard origin/main
            fi
            node mensajeria/scripts/aplicar-llegados.js   # precios y productos nuevos de la hoja LISTADO del Excel
            node mensajeria/scripts/extraer-tarifas.js
            node mensajeria/scripts/catalogo-meta.js      # lista para Meta y página /stock/
            node mensajeria/scripts/fechas-llegada.js     # fecha en que llegó cada producto (para Mati)
            git add index.html mensajeria/tarifas-envio.js mensajeria/productos-catalogo.js catalogo-meta.csv catalogo-meta stock/index.html stock/stock.csv stock/precios-pendientes.csv mensajeria/precios-excel.json stock/llegadas.json
            if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
            git commit -q -m "Catálogo, tarifas y catálogo de Meta actualizados desde el stock del Excel"
            if git push origin HEAD:main; then echo "publicar=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Otro cambio llegó primero; se regenera sobre la versión nueva (intento $i)"
          done
          echo "No se pudo guardar tras 5 intentos"; exit 1
      # Los commits del bot no publican la página solos: se pide la publicación
      - name: Publicar sitio
        if: steps.guardar.outputs.publicar == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación"
      - name: Avisar al celular si falló
        if: failure()
        env:
          NTFY_TEMA: ${{ secrets.NTFY_TEMA }}
          NOMBRE: ${{ github.workflow }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$NTFY_TEMA" ] && exit 0
          jq -n --arg t "$NTFY_TEMA" --arg n "$NOMBRE" --arg u "$ENLACE" \
            '{topic:$t, title:("⚠️ Falló en GitHub: " + $n), message:("Revisa el detalle: " + $u), priority:4, tags:["warning"], click:$u}' \
            | curl -s -X POST -H "Content-Type: application/json" --data @- https://ntfy.sh/ > /dev/null || true
