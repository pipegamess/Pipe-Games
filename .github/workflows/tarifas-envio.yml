name: Tarifas de envío para la mensajería

# Cuando cambian el catálogo o el stock:
#  - copia tarifas y productos del catálogo a la mensajería (tarifas-envio.js, productos-catalogo.js)
#  - genera catalogo-meta.csv (lista de productos para el catálogo de WhatsApp/Meta, con disponibilidad del stock)
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "stock.json"
      - "mensajeria/scripts/extraer-tarifas.js"
      - "mensajeria/scripts/catalogo-meta.js"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: datos-catalogo
  cancel-in-progress: false

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mensajeria/scripts/extraer-tarifas.js
      - name: Lista de productos para Meta
        run: |
          npm install --no-save --no-package-lock sharp@0.33.5
          node mensajeria/scripts/catalogo-meta.js
      - name: Guardar si cambió
        id: guardar
        run: |
          git add mensajeria/tarifas-envio.js mensajeria/productos-catalogo.js catalogo-meta.csv catalogo-meta
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git commit -m "Tarifas, productos y catálogo de Meta actualizados desde el catálogo"
          git pull --rebase
          git push
          echo "publicar=1" >> "$GITHUB_OUTPUT"
      # Los commits del bot no publican la página solos: se pide la publicación
      - name: Publicar sitio
        if: steps.guardar.outputs.publicar == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la publicación"
