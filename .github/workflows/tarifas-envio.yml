name: Tarifas de envío para la mensajería

# Cuando cambia el catálogo, copia sus tarifas de envío a mensajeria/tarifas-envio.js
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "mensajeria/scripts/extraer-tarifas.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mensajeria/scripts/extraer-tarifas.js
      - name: Guardar si cambió
        run: |
          if git diff --quiet; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898799+github-actions[bot]@users.noreply.github.com"
          git add mensajeria/tarifas-envio.js mensajeria/productos-catalogo.js
          git commit -m "Tarifas y productos actualizados desde el catálogo"
          git push
