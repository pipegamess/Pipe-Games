<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Games – Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --ps4: #3a7bd5;
    --ps5: #00c896;
    --switch: #e84040;
    --acc: #f5c400;
    --text: #e8e8f0;
    --muted: #7a7a9a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%; transform: translateX(-50%);
    width: 500px; height: 200px;
    background: radial-gradient(ellipse, rgba(58,123,213,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo {
    font-family: 'Rajdhani', sans-serif;
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: #fff;
  }
  .logo span { color: var(--ps4); }
  .tagline {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 0.25rem;
  }

  /* TABS */
  .tabs {
    display: flex;
    overflow-x: auto;
    gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 0.85rem 0.5rem;
    text-align: center;
    cursor: pointer;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { color: var(--text); background: var(--surface2); }
  .tab.active[data-tab="ps4"] { color: var(--ps4); border-color: var(--ps4); }
  .tab.active[data-tab="ps5"] { color: var(--ps5); border-color: var(--ps5); }
  .tab.active[data-tab="switch"] { color: var(--switch); border-color: var(--switch); }
  .tab.active[data-tab="acc"] { color: var(--acc); border-color: var(--acc); }

  /* SEARCH */
  .search-bar {
    padding: 1rem 1.5rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .search-bar input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.6rem 1rem;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border 0.2s;
  }
  .search-bar input:focus { border-color: rgba(255,255,255,0.2); }
  .search-bar input::placeholder { color: var(--muted); }

  /* CONTENT */
  .panel { display: none; }
  .panel.active { display: block; }

  .count-bar {
    padding: 0.6rem 1.5rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .game-list { padding: 0 0 4rem; }
  .game-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .game-item:hover { background: var(--surface2); }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ps4 { background: var(--ps4); box-shadow: 0 0 6px var(--ps4); }
  .dot-ps5 { background: var(--ps5); box-shadow: 0 0 6px var(--ps5); }
  .dot-switch { background: var(--switch); box-shadow: 0 0 6px var(--switch); }
  .dot-sw2 { background: var(--switch); box-shadow: 0 0 6px var(--switch); }
  .dot-acc { background: var(--acc); box-shadow: 0 0 6px var(--acc); }

  .game-name { flex: 1; font-size: 0.875rem; font-weight: 400; line-height: 1.3; }
  .game-platform {
    font-size: 0.7rem;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 2px 7px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .plat-ps4 { background: rgba(58,123,213,0.15); color: var(--ps4); }
  .plat-ps5 { background: rgba(0,200,150,0.12); color: var(--ps5); }
  .plat-switch { background: rgba(232,64,64,0.12); color: var(--switch); }
  .plat-sw2 { background: rgba(232,64,64,0.2); color: #ff6b6b; }
  .plat-acc { background: rgba(245,196,0,0.12); color: var(--acc); }
  .plat-nintendo { background: rgba(232,64,64,0.12); color: var(--switch); }
  .plat-zen { background: rgba(245,196,0,0.12); color: var(--acc); }

  .game-price {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    min-width: 75px;
    text-align: right;
    flex-shrink: 0;
    color: #fff;
  }

  /* SW2 badge */
  .sw2-badge {
    font-size: 0.6rem;
    background: rgba(232,64,64,0.25);
    color: #ff6b6b;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 1px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* FOOTER */
  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.6rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.72rem;
    color: var(--muted);
  }
  footer a {
    color: var(--ps4);
    text-decoration: none;
    font-weight: 500;
  }

  .no-results {
    padding: 3rem 1.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    display: none;
  }
</style>
</head>

  const countEl = document.getElementById("count-" + tab);
  const q = query.toLowerCase();
  const filtered = data.filter(g => g[0].toLowerCase().includes(q) || g[1].toLowerCase().includes(q));
  countEl.textContent = filtered.length + " producto" + (filtered.length !== 1 ? "s" : "");
  if (filtered.length === 0) {
    list.innerHTML = "";
    noRes.style.display = "block";
    return;
  }
  noRes.style.display = "none";
  list.innerHTML = filtered.map(g => {
    const sw2badge = g[1] === "SWITCH 2" ? '<span class="sw2-badge">SW2</span>' : "";
    return `<div class="game-item">
      <div class="${dotClass(tab, g[1])}"></div>
      <span class="game-name">${g[0]}</span>
      ${sw2badge}
      <span class="game-platform ${platClass(g[1])}">${g[1]}</span>
      <span class="game-price">${g[2]}</span>
    </div>`;
  }).join("");
}

let activeTab = "ps4";
const datasets = { ps4, ps5, switch: sw, acc };

function renderActive(q) {
  render(activeTab, datasets[activeTab], q || "");
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    activeTab = t.dataset.tab;
    document.getElementById("panel-" + activeTab).classList.add("active");
    renderActive(document.getElementById("search").value);
  });
});

document.getElementById("search").addEventListener("input", e => {
  renderActive(e.target.value);
});

// Initial render all
["ps4","ps5","switch","acc"].forEach(t => render(t, datasets[t], ""));
</script>
</body>
</html>
