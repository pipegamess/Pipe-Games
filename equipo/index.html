<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Equipo · Pipe Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Equipo Pipe Games: Mati (reabastecimiento), Tomi (lanzamientos), Anto (precios) y Luca (Mercado Ads).
   Los informes y las ventas son privados: se leen a través del Worker con la cuenta de despacho. */
:root {
  --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26; --line: rgba(255,255,255,0.09);
  --text: #e8e8f0; --muted: #8a8aa8; --acc: #f5c400; --acc-ink: #141000; --ok: #3ecf8e; --warn: #ffb35c; --err: #ff7b7b;
  --display: 'Rajdhani', 'Arial Narrow', Arial, sans-serif; --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--text); margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6vw, 34px); letter-spacing: 0.02em; margin: 0; line-height: 1.05; }
h1 span { color: var(--acc); }
h2 { font-family: var(--display); font-size: 20px; letter-spacing: 0.05em; text-transform: uppercase; margin: 0; }
h3 { font-family: var(--display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; color: var(--acc); }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; max-width: 64ch; }
.top { display: flex; gap: 8px; flex-wrap: wrap; }
.top a, button.ghost { font: 600 13px/1 var(--body); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-decoration: none; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; }
.login { max-width: 400px; margin: 10vh auto 0; }
label { display: grid; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
input { font: 500 15px var(--body); color: var(--text); background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; }
button.primary { font: 700 15px var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--acc); color: var(--acc-ink); border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
button.primary:disabled { opacity: .55; cursor: wait; }
.status { font-size: 13px; min-height: 18px; }
.status.err { color: var(--err); }
/* Tarjetas del equipo */
.equipo { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.miembro { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 12px; align-items: center; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
.miembro.activo { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
.miembro img { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--acc); object-fit: cover; background: #fff; }
.miembro b { font-family: var(--display); font-size: 22px; letter-spacing: .02em; display: block; line-height: 1.1; }
.miembro small { display: block; color: var(--muted); font-size: 13px; }
.miembro .estado { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--acc-ink); background: var(--acc); border-radius: 999px; padding: 2px 8px; }
.miembro .estado.pronto { background: var(--surface2); color: var(--muted); }
/* Informe */
.informe-cab { display: grid; grid-template-columns: clamp(110px, 28vw, 180px) minmax(0, 1fr); gap: 16px; align-items: center; }
.informe-cab img { width: 100%; height: auto; border-radius: 14px; border: 2px solid var(--acc); background: #fff; }
.resumen { font-size: 16px; line-height: 1.55; margin: 0; max-width: 70ch; }
.meta { color: var(--muted); font-size: 13px; }
.lista { display: grid; gap: 8px; }
.item { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; }
.item b { font-weight: 700; }
.item .m { grid-column: 1 / -1; color: var(--muted); font-size: 13.5px; }
.cant { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--acc); white-space: nowrap; }
.prio { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border-radius: 999px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
.prio.alta { background: rgba(255,123,123,.16); color: var(--err); }
.prio.media { background: rgba(255,179,92,.16); color: var(--warn); }
.prio.baja { background: rgba(62,207,142,.14); color: var(--ok); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.vacio { color: var(--muted); font-size: 14px; margin: 0; }
.aviso { background: rgba(245,196,0,.1); border: 1px solid rgba(245,196,0,.35); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.alertas { display: grid; gap: 10px; }
.alerta { border-radius: 12px; padding: 12px 14px; border-left: 4px solid var(--warn); background: rgba(255,179,92,.08); display: grid; gap: 4px; }
.alerta.oportunidad { border-color: var(--ok); background: rgba(62,207,142,.08); }
.alerta.evitar { border-color: var(--err); background: rgba(255,123,123,.08); }
.alerta.ordenar { border-color: var(--muted); background: rgba(255,255,255,.04); }
.alerta .tipo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.alerta b { font-size: 15px; } .alerta p { margin: 0; font-size: 14px; line-height: 1.45; }
.alerta .hacer { color: var(--fg, inherit); } .alerta .hacer::before { content: "→ "; font-weight: 700; }
.dudas { display: grid; gap: 10px; }
.duda { border: 1px solid rgba(245,196,0,.35); background: rgba(245,196,0,.07); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; }
.duda p { margin: 0; font-size: 14px; line-height: 1.45; }
.duda .ops { display: grid; gap: 6px; }
.duda .ops button { text-align: left; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 10px; cursor: pointer; }
.duda.lista { opacity: .6; border-style: dashed; background: none; }
.lanz { display: grid; grid-template-columns: 74px 1fr; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,.08); }
.lanz:first-child { border-top: 0; }
.lanz .f { font-family: var(--display); font-weight: 700; color: var(--acc); font-size: 14px; line-height: 1.2; }
.lanz .f small { display: block; color: var(--muted); font-weight: 400; font-family: inherit; font-size: 11px; }
.lanz p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
.lanz .hacer { color: inherit; } .lanz .hacer::before { content: "→ "; font-weight: 700; }
.lanz a { font-size: 12px; color: var(--muted); }
.mesTit { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.top3 { display: grid; gap: 8px; }
details.sec { border: 1px solid var(--line, rgba(255,255,255,.12)); border-radius: 12px; padding: 0 14px; }
details.sec > summary { cursor: pointer; list-style: none; padding: 12px 0; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "▸"; color: var(--muted); }
details.sec[open] > summary::after { content: "▾"; }
details.sec[open] { padding-bottom: 12px; }
.num { color: var(--muted); font-weight: 400; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; border-radius: 999px; padding: 3px 10px; background: rgba(255,255,255,.06); }
.item.hecho { opacity: .45; } .item.hecho b { text-decoration: line-through; }
.marca { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); grid-column: 1 / -1; cursor: pointer; }
.hist { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.hist select { font: inherit; padding: 6px 8px; border-radius: 8px; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>

<form class="panel login" id="vLogin" hidden>
  <h2 style="text-transform:none">Equipo · Pipe Games</h2>
  <p class="sub">Entra con tu correo y contraseña de administrador de Pipe Games.</p>
  <label>Correo<input id="lCorreo" type="email" autocomplete="username" required></label>
  <label>Contraseña<input id="lClave" type="password" autocomplete="current-password" required></label>
  <button class="primary" type="submit" id="lEntrar">Entrar</button>
  <div class="status err" id="lError" role="alert"></div>
</form>

<div class="wrap" id="vApp" hidden>
  <header>
    <div>
      <h1>Equipo <span>Pipe Games</span></h1>
      <p class="sub">Cuatro analistas con IA que revisan tus ventas, tu stock y el mercado, y te dicen qué hacer. Todo lo que ven es privado.</p>
    </div>
    <div class="top"><a href="../inicio/">Centro de Mando</a><a href="../mensajeria/">Panel de despacho</a><button class="ghost" type="button" id="salir">Salir</button></div>
  </header>

  <div class="equipo" id="equipo"></div>

  <section class="panel" id="vInforme"></section>
</div>

<script type="module">
import { firebaseConfig, ADMIN_UID, FIREBASE_VERSION, SKYDROPX_URL } from "../mensajeria/config.js?v=30261118a";
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-app.js`);
const { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } = await import(`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/firebase-auth.js`);
const auth = getAuth(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fechaHora = t => t ? new Date(t).toLocaleString("es-CO", { weekday: "long", day: "numeric", month: "long", hour: "numeric", minute: "2-digit" }) : "";

const EQUIPO = [
  { id: "mati", nombre: "Mati", rol: "Analista de Inventario", lema: "Siempre un paso adelante · te dice qué recomprar", listo: true },
  { id: "tomi", nombre: "Tomi", rol: "Vigía de Lanzamientos", lema: "Te dice qué juegos vienen y qué preparar", listo: true },
  { id: "anto", nombre: "Anto", rol: "Revisora de Precios", lema: "Te dice CÓMO estás de precio" },
  { id: "luca", nombre: "Luca", rol: "Optimizador de Mercado Ads", lema: "Te dice DÓNDE pierdes plata" }
];
let elegido = "mati", DATOS = null, verT = null, borrando = false, verTomi = null, borrandoTomi = false;
const respondidasAhora = new Set(); // dudas respondidas en esta visita (al recargar la página desaparecen) // verT: qué informe del historial se está viendo

async function worker(metodo, extra) {
  const token = await auth.currentUser.getIdToken();
  const r = await fetch(SKYDROPX_URL.replace(/\/+$/, ""), { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify({ metodo, ...(extra || {}) }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || ("Error " + r.status));
  return j;
}
function pintarEquipo() {
  $("equipo").innerHTML = EQUIPO.map(m => `<button type="button" class="miembro${m.id === elegido ? " activo" : ""}" data-m="${m.id}">
    <img src="${m.id}-avatar.jpg?v=3" alt="${m.nombre}" width="72" height="72">
    <span><b>${m.nombre}</b><small>${m.rol}</small><span class="estado${m.listo ? "" : " pronto"}">${m.listo ? "Trabajando" : "Próximamente"}</span></span>
  </button>`).join("");
}
$("equipo").addEventListener("click", e => { const b = e.target.closest("[data-m]"); if (!b) return; elegido = b.dataset.m; pintarEquipo(); pintarInforme(); });

const item = (titulo, derecha, motivo, extra = "", cls = "") => `<div class="item${cls}"><span>${titulo}</span>${derecha ? `<span class="cant">${derecha}</span>` : "<span></span>"}${motivo ? `<span class="m">${esc(motivo)}</span>` : ""}${extra}</div>`;
const claveMarca = (t, x) => t + "|" + String(x.producto || "").toLowerCase() + "|" + String(x.consola || "").toLowerCase();
const RANGO = { alta: 0, media: 1, baja: 2 };
function informes() {
  const h = (DATOS && DATOS.historial) || [];
  return h.length ? h : (DATOS && DATOS.mati ? [DATOS.mati] : []);
}
function seccion(titulo, arr, f, abierta) {
  const n = (arr || []).length;
  return `<details class="sec"${abierta ? " open" : ""}><summary><span>${titulo} <span class="num">(${n})</span></span></summary>${n ? `<div class="lista">${arr.map(f).join("")}</div>` : `<p class="vacio">Nada por ahora.</p>`}</details>`;
}
const TIPOS = { revisar: "🔍 Revisar", oportunidad: "💡 Oportunidad", evitar: "⛔ Evitar", ordenar: "🧹 Ordenar" };
function pintarAlertas(al) {
  if (!al || !al.length) return "";
  return `<div><h3>Para tener en cuenta</h3><div class="alertas">${al.map(x => typeof x === "string"
    ? `<div class="alerta"><p>${esc(x)}</p></div>`
    : `<div class="alerta ${esc(x.tipo)}"><span class="tipo">${TIPOS[x.tipo] || "Aviso"}</span><b>${esc(x.titulo)}</b>${x.que_pasa ? `<p>${esc(x.que_pasa)}</p>` : ""}${x.que_hacer ? `<p class="hacer">${esc(x.que_hacer)}</p>` : ""}</div>`).join("")}</div></div>`;
}
function pintarDudas(dudas) {
  if (!dudas || !dudas.length) return "";
  const alias = DATOS.alias || {};
  dudas = dudas.filter(x => !alias[x.clave] || respondidasAhora.has(x.clave));
  if (!dudas.length) return "";
  const pend = dudas.filter(x => !alias[x.clave]);
  return `<div><h3>Mati necesita que le confirmes${pend.length ? ` <span class="num">(${pend.length})</span>` : ""}</h3>
  <p class="meta">Estos nombres aparecen en tus ventas pero no están igual en el inventario. Mati no los da por agotados hasta que le digas.</p>
  <div class="dudas">${dudas.map(x => { const r = alias[x.clave];
    if (r) { const op = (x.opciones || []).find(o => o.clave === r);
      return `<div class="duda lista"><p>✓ <b>${esc(x.nombre)}</b> → ${r === "AGOTADO" ? "está agotado" : "es " + esc(op ? op.nombre : r)}.</p><button type="button" class="ghost" data-conf="${esc(x.clave)}" data-dest="">Deshacer</button></div>`; }
    return `<div class="duda"><p>En ventas aparece <b>${esc(x.nombre)}</b>${x.consola ? " (" + esc(x.consola) + ")" : ""}, con ${x.vendidas} vendidas en el año, pero no lo encuentro con ese nombre en el inventario. ¿Es alguno de estos?</p>
      <div class="ops">${(x.opciones || []).map(o => `<button type="button" data-conf="${esc(x.clave)}" data-dest="${esc(o.clave)}">Sí, es <b>${esc(o.nombre)}</b> · stock ${o.stock < 0 ? "en importación" : esc(o.stock)}</button>`).join("")}
      <button type="button" data-conf="${esc(x.clave)}" data-dest="AGOTADO">Ninguno de estos: ese producto está agotado (ya no lo tengo)</button></div></div>`; }).join("")}</div></div>`;
}
function pintarTomi(cab) {
  const v = $("vInforme"), lista = (DATOS.tomi && DATOS.tomi.historial) || [];
  const btn = `<div class="acciones"><button class="primary" type="button" id="generarTomi">Pedirle a Tomi un informe nuevo</button><span class="status" id="tEstado"></span></div>`;
  const actual = lista.find(x => x.t === verTomi) || lista[0], inf = actual && actual.informe;
  if (!inf) { v.innerHTML = cab + `<p class="vacio">Aún no hay informes. Tomi entrega uno cada sábado a las 5:30 p. m., o puedes pedírselo ahora (tarda cerca de 1 minuto porque busca en internet).</p>` + btn; return; }
  const hist = lista.length > 1 ? `<label class="hist">Ver informe: <select id="histTomi">${lista.map((x, i) => `<option value="${x.t}"${x === actual ? " selected" : ""}>${i === 0 ? "Último · " : ""}${esc(fechaHora(x.t))}</option>`).join("")}</select></label>` : "";
  const lz = [...(inf.lanzamientos || [])].sort((a, b) => String(a.fecha_iso || "").localeCompare(String(b.fecha_iso || "")));
  const urg = lz.filter(x => x.interes === "alta");
  const mesDe = x => { const d = new Date((x.fecha_iso || "") + "T12:00:00"); return isNaN(d) ? "Sin fecha" : d.toLocaleDateString("es-CO", { month: "long", year: "numeric" }); };
  const dia = x => { const d = new Date((x.fecha_iso || "") + "T12:00:00"); return isNaN(d) || !x.fecha_confirmada ? "Por confirmar" : d.toLocaleDateString("es-CO", { day: "numeric", month: "short" }); };
  const fila = x => `<div class="lanz"><div class="f">${esc(dia(x))}<small>${esc((x.consolas || []).join(" · "))}</small></div><div><b>${esc(x.titulo)}</b><span class="prio ${esc(x.interes)}">${esc(x.interes || "")}</span>
    ${x.por_que ? `<p>${esc(x.por_que)}</p>` : ""}${x.accion ? `<p class="hacer">${esc(x.accion)}</p>` : ""}${!x.fecha_confirmada && x.fecha ? `<p>Fecha anunciada: ${esc(x.fecha)}</p>` : ""}${/^https?:\/\//.test(x.fuente || "") ? `<a href="${esc(x.fuente)}" target="_blank" rel="noopener">Fuente</a>` : ""}</div></div>`;
  let porMes = "", mesAnt = "";
  for (const x of lz) { const mm = mesDe(x); if (mm !== mesAnt) { porMes += `<div class="mesTit">${esc(mm)}</div>`; mesAnt = mm; } porMes += fila(x); }
  const chips = `<div class="chips"><span class="chip">Lanzamientos: ${lz.length}</span><span class="chip">Interés alto: ${urg.length}</span><span class="chip">Preventas sugeridas: ${(inf.preventas || []).length}</span><span class="chip">Avisar a clientes: ${(inf.avisar_clientes || []).length}</span></div>`;
  v.innerHTML = cab + hist + `<p class="meta">${actual === lista[0] ? "Informe más reciente" : "Informe anterior"} · ${fechaHora(actual.t)}</p><p class="resumen">${esc(inf.resumen)}</p>` +
    pintarAlertas(inf.alertas) + chips +
    (urg.length ? `<div><h3>Lo que más te interesa</h3><div>${urg.slice(0, 4).map(fila).join("")}</div></div>` : "") +
    seccion("Preventas sugeridas", inf.preventas, x => item(`<b>${esc(x.titulo)}</b> ${esc(x.consola || "")}`, x.cantidad ? "×" + x.cantidad : "", x.por_que), false) +
    seccion("Avisar a clientes en espera", inf.avisar_clientes, x => item(`<b>${esc(x.titulo)}</b>`, "", x.que_decir), false) +
    `<details class="sec"><summary><span>Calendario completo <span class="num">(${lz.length})</span></span></summary>${porMes || `<p class="vacio">Nada por ahora.</p>`}</details>` +
    btn + `<div class="acciones" style="margin-top:6px">${borrandoTomi
      ? `<span class="status err">¿Eliminar el informe del ${esc(fechaHora(actual.t))}? No se puede recuperar.</span><button type="button" class="primary" id="borrarTomiSi" data-t="${actual.t}">Sí, eliminar</button><button type="button" class="ghost" id="borrarTomiNo">Cancelar</button>`
      : `<button type="button" class="ghost" id="borrarTomi">Eliminar este informe</button>`}<span class="status" id="btEstado"></span></div>`;
}
function pintarInforme() {
  const m = EQUIPO.find(x => x.id === elegido), v = $("vInforme");
  const cab = `<div class="informe-cab"><img src="${m.id}.jpg?v=3" alt="${m.nombre}" width="600" height="750"><div><h2>${m.nombre} · ${m.rol}</h2><p class="meta">${m.lema}</p></div></div>`;
  if (m.id === "tomi" && DATOS) return pintarTomi(cab);
  if (!m.listo) { v.innerHTML = cab + `<p class="vacio">${m.nombre} se suma al equipo pronto. Primero dejamos a Mati funcionando con tus datos.</p>`; return; }
  if (!DATOS) { v.innerHTML = cab + `<p class="vacio">Cargando el informe…</p>`; return; }
  const ventas = DATOS.ventas, lista = informes(), marcas = DATOS.marcas || {};
  const actual = lista.find(x => x.t === verT) || lista[0], inf = actual && actual.informe;
  const avisoVentas = !ventas ? `<div class="aviso">Mati todavía no tiene tus ventas del Excel. Mientras tanto decide solo con el stock y la lista de espera. Las ventas llegan solas (en privado) cada vez que abres el Excel.</div>`
    : `<p class="meta">Ventas del Excel recibidas el ${fechaHora(ventas.t)} · ${ventas.filas} registros.</p>`;
  const btn = `<div class="acciones"><button class="primary" type="button" id="generar">Pedirle a Mati un informe nuevo</button><span class="status" id="gEstado"></span></div>`;
  if (!inf) { v.innerHTML = cab + avisoVentas + `<p class="vacio">Aún no hay informes. Mati entrega uno cada sábado a las 5:30 p. m., o puedes pedírselo ahora.</p>` + btn; return; }
  const esUltimo = actual === lista[0];
  const hist = lista.length > 1 ? `<label class="hist">Ver informe: <select id="histSel">${lista.map((x, i) => `<option value="${x.t}"${x === actual ? " selected" : ""}>${i === 0 ? "Último · " : ""}${esc(fechaHora(x.t))}</option>`).join("")}</select></label>` : "";
  const rec = [...(inf.recomprar || [])].sort((a, b) => (RANGO[a.prioridad] ?? 3) - (RANGO[b.prioridad] ?? 3));
  const pend = rec.filter(x => !marcas[claveMarca(actual.t, x)]);
  const filaRec = x => { const k = claveMarca(actual.t, x), h = !!marcas[k];
    return item(`<b>${esc(x.producto)}</b> ${esc(x.consola || "")}<span class="prio ${esc(x.prioridad)}">${esc(x.prioridad || "")}</span>`, x.cantidad ? "×" + x.cantidad : "", x.motivo,
      `<label class="marca"><input type="checkbox" data-k="${esc(k)}"${h ? " checked" : ""}> Ya lo compré</label>`, h ? " hecho" : ""); };
  const top = pend.filter(x => x.prioridad === "alta").slice(0, 3);
  const chips = `<div class="chips"><span class="chip">Recomprar: ${pend.length} pendientes de ${rec.length}</span><span class="chip">No recomprar: ${(inf.no_recomprar || []).length}</span><span class="chip">Impulsar: ${(inf.impulsar || []).length}</span><span class="chip">Lo piden: ${(inf.pedir_nuevo || []).length}</span></div>`;
  v.innerHTML = cab + hist + `<p class="meta">${esUltimo ? "Informe más reciente" : "Informe anterior"} · ${fechaHora(actual.t)}</p><p class="resumen">${esc(inf.resumen)}</p>` +
    (esUltimo ? pintarDudas(inf.dudas) : "") + pintarAlertas(inf.alertas) + chips +
    (top.length ? `<div><h3>Lo más urgente</h3><div class="top3">${top.map(filaRec).join("")}</div></div>` : (rec.length ? `<p class="vacio">✓ Ya marcaste todo lo urgente de este informe.</p>` : "")) +
    seccion("Recomprar (todo)", rec, filaRec, false) +
    seccion("No recomprar", inf.no_recomprar, x => item(`<b>${esc(x.producto)}</b> ${esc(x.consola || "")}`, "", x.motivo), false) +
    seccion("Impulsar (stock quieto)", inf.impulsar, x => item(`<b>${esc(x.producto)}</b> ${esc(x.consola || "")}`, "", x.idea), false) +
    seccion("Lo piden y no lo tienes", inf.pedir_nuevo, x => item(`<b>${esc(x.producto)}</b>`, "", x.motivo), false) +
    avisoVentas + btn +
    `<div class="acciones" style="margin-top:6px">${borrando
      ? `<span class="status err">¿Eliminar el informe del ${esc(fechaHora(actual.t))}? No se puede recuperar.</span><button type="button" class="primary" id="borrarSi" data-t="${actual.t}">Sí, eliminar</button><button type="button" class="ghost" id="borrarNo">Cancelar</button>`
      : `<button type="button" class="ghost" id="borrar">Eliminar este informe</button>`}<span class="status" id="bEstado"></span></div>`;
}
$("vInforme").addEventListener("change", async e => {
  if (e.target.id === "histTomi") { verTomi = Number(e.target.value); borrandoTomi = false; pintarInforme(); return; }
  if (e.target.id === "histSel") { verT = Number(e.target.value); borrando = false; pintarInforme(); return; }
  const c = e.target.closest("input[data-k]"); if (!c) return;
  const k = c.dataset.k, hecho = c.checked;
  DATOS.marcas = DATOS.marcas || {}; if (hecho) DATOS.marcas[k] = Date.now(); else delete DATOS.marcas[k];
  const abiertas = [...document.querySelectorAll("details.sec")].map(d => d.open);
  pintarInforme(); document.querySelectorAll("details.sec").forEach((d, i) => d.open = !!abiertas[i]);
  try { await worker("MATI_MARCAR", { clave: k, hecho }); }
  catch (err) { if (hecho) delete DATOS.marcas[k]; else DATOS.marcas[k] = 1; pintarInforme(); alertaFallo(err); }
});
function alertaFallo(err) { $("vInforme").insertAdjacentHTML("afterbegin", `<p class="status err">No se guardó la marca: ${esc(err.message)}</p>`); }
$("vInforme").addEventListener("click", async e => {
  const c = e.target.closest("[data-conf]");
  if (c) {
    const clave = c.dataset.conf, destino = c.dataset.dest, antes = (DATOS.alias || {})[clave];
    respondidasAhora.add(clave);
    DATOS.alias = DATOS.alias || {}; if (destino) DATOS.alias[clave] = destino; else delete DATOS.alias[clave];
    pintarInforme();
    try { await worker("MATI_CONFIRMAR", { clave, destino }); }
    catch (err) { if (antes) DATOS.alias[clave] = antes; else delete DATOS.alias[clave]; pintarInforme(); $("vInforme").insertAdjacentHTML("afterbegin", `<p class="status err">No se guardó: ${esc(err.message)}</p>`); }
    return;
  }
  if (e.target.closest("#borrarTomi")) { borrandoTomi = true; pintarInforme(); return; }
  if (e.target.closest("#borrarTomiNo")) { borrandoTomi = false; pintarInforme(); return; }
  const bt = e.target.closest("#borrarTomiSi");
  if (bt) {
    const t = Number(bt.dataset.t); bt.disabled = true;
    try { await worker("TOMI_BORRAR", { t }); DATOS.tomi = { historial: ((DATOS.tomi && DATOS.tomi.historial) || []).filter(x => Number(x.t) !== t) }; verTomi = null; borrandoTomi = false; pintarInforme(); }
    catch (err) { bt.disabled = false; $("btEstado").className = "status err"; $("btEstado").textContent = err.message; }
    return;
  }
  if (e.target.closest("#generarTomi")) {
    const b = $("generarTomi"); b.disabled = true; $("tEstado").className = "status"; $("tEstado").textContent = "Tomi está buscando lanzamientos en internet y cruzándolos con tus ventas (cerca de 1 minuto)…";
    try { const r = await worker("TOMI_GENERAR"); DATOS.tomi = { historial: [{ t: r.t, informe: r.informe }, ...((DATOS.tomi && DATOS.tomi.historial) || [])].slice(0, 8) }; verTomi = null; pintarInforme(); }
    catch (err) { $("tEstado").className = "status err"; $("tEstado").textContent = err.message; b.disabled = false; }
    return;
  }
  if (e.target.closest("#borrar")) { borrando = true; pintarInforme(); return; }
  if (e.target.closest("#borrarNo")) { borrando = false; pintarInforme(); return; }
  const bs = e.target.closest("#borrarSi");
  if (bs) {
    const t = Number(bs.dataset.t); bs.disabled = true;
    try {
      await worker("MATI_BORRAR", { t });
      const resto = informes().filter(x => Number(x.t) !== t);
      DATOS = { ...DATOS, historial: resto, mati: resto[0] || null }; verT = null; borrando = false; pintarInforme();
    } catch (err) { bs.disabled = false; $("bEstado").className = "status err"; $("bEstado").textContent = err.message; }
    return;
  }
  if (!e.target.closest("#generar")) return;
  const b = $("generar"); b.disabled = true; $("gEstado").className = "status"; $("gEstado").textContent = "Mati está revisando ventas, stock y lista de espera (unos 30 segundos)…";
  try { const r = await worker("MATI_GENERAR"); const nuevo = { t: r.t, informe: r.informe };
    DATOS = { ...DATOS, mati: nuevo, historial: [nuevo, ...informes()].slice(0, 8) }; verT = null; pintarInforme(); }
  catch (err) { $("gEstado").className = "status err"; $("gEstado").textContent = err.message; b.disabled = false; }
});
async function cargar() {
  try { DATOS = await worker("EQUIPO_LEER"); }
  catch (e) { DATOS = { mati: null, ventas: null, historial: [], marcas: {} }; $("vInforme").insertAdjacentHTML("afterbegin", `<p class="status err">No se pudo leer el informe: ${esc(e.message)}</p>`); }
  pintarInforme();
}

$("vLogin").addEventListener("submit", async ev => {
  ev.preventDefault(); $("lError").textContent = ""; $("lEntrar").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("lCorreo").value.trim(), $("lClave").value); }
  catch { $("lError").textContent = "Correo o contraseña incorrectos."; }
  $("lEntrar").disabled = false;
});
$("salir").onclick = () => signOut(auth);
onAuthStateChanged(auth, async u => {
  if (u && u.uid !== ADMIN_UID) { await signOut(auth); $("lError").textContent = "Esta cuenta no tiene acceso al equipo."; return; }
  $("vLogin").hidden = !!u; $("vApp").hidden = !u;
  if (!u) { DATOS = null; return; }
  pintarEquipo(); pintarInforme(); cargar();
});
</script>
</body>
