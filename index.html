<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipe Games – Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07);
    --ps4: #3a7bd5;
    --ps5: #00c896;
    --switch: #e84040;
    --acc: #f5c400;
    --text: #e8e8f0;
    --muted: #7a7a9a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; min-height:100vh; }

  header {
    padding: 1.5rem 1.5rem 1rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content:''; position:absolute; top:-60px; left:50%; transform:translateX(-50%);
    width:500px; height:200px;
    background:radial-gradient(ellipse, rgba(58,123,213,0.15) 0%, transparent 70%);
    pointer-events:none;
  }
  .logo-img { width:100px; height:100px; border-radius:50%; object-fit:cover; margin-bottom:0.4rem; }
  .tagline { font-size:0.75rem; color:var(--muted); letter-spacing:4px; text-transform:uppercase; }

  .tabs {
    display:flex; overflow-x:auto; background:var(--surface);
    border-bottom:1px solid var(--border); scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex:1; min-width:80px; padding:0.85rem 0.5rem; text-align:center; cursor:pointer;
    font-family:'Rajdhani',sans-serif; font-size:0.95rem; font-weight:600; letter-spacing:1px;
    color:var(--muted); border-bottom:3px solid transparent; transition:all 0.2s;
    white-space:nowrap; user-select:none;
  }
  .tab:hover { color:var(--text); background:var(--surface2); }
  .tab.active[data-tab="ps4"] { color:var(--ps4); border-color:var(--ps4); }
  .tab.active[data-tab="ps5"] { color:var(--ps5); border-color:var(--ps5); }
  .tab.active[data-tab="switch"] { color:var(--switch); border-color:var(--switch); }
  .tab.active[data-tab="acc"] { color:var(--acc); border-color:var(--acc); }

  .search-bar { padding:1rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); }
  .search-bar input {
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:0.6rem 1rem; color:var(--text);
    font-family:'Barlow',sans-serif; font-size:0.9rem; outline:none;
  }
  .search-bar input::placeholder { color:var(--muted); }

  .panel { display:none; }
  .panel.active { display:block; }
  .count-bar { padding:0.6rem 1.5rem; font-size:0.75rem; color:var(--muted); letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border); }
  .game-list { padding:0 0 5rem; }
  .game-item {
    display:flex; align-items:center; gap:12px;
    padding:0.75rem 1.5rem; border-bottom:1px solid var(--border); transition:background 0.15s;
  }
  .game-item:hover { background:var(--surface2); }
  .game-item.inactive { opacity:0.35; }
  .dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot-ps4 { background:var(--ps4); box-shadow:0 0 6px var(--ps4); }
  .dot-ps5 { background:var(--ps5); box-shadow:0 0 6px var(--ps5); }
  .dot-switch { background:var(--switch); box-shadow:0 0 6px var(--switch); }
  .dot-sw2 { background:var(--switch); box-shadow:0 0 6px var(--switch); }
  .dot-acc { background:var(--acc); box-shadow:0 0 6px var(--acc); }
  .dot-off { background:var(--muted); box-shadow:none; }
  .game-name { flex:1; font-size:0.875rem; font-weight:400; line-height:1.3; }
  .game-platform {
    font-size:0.7rem; font-family:'Rajdhani',sans-serif; font-weight:600;
    letter-spacing:1px; padding:2px 7px; border-radius:3px; flex-shrink:0;
  }
  .plat-ps4 { background:rgba(58,123,213,0.15); color:var(--ps4); }
  .plat-ps5 { background:rgba(0,200,150,0.12); color:var(--ps5); }
  .plat-switch { background:rgba(232,64,64,0.12); color:var(--switch); }
  .plat-sw2 { background:rgba(232,64,64,0.2); color:#ff6b6b; }
  .plat-acc { background:rgba(245,196,0,0.12); color:var(--acc); }
  .plat-nintendo { background:rgba(232,64,64,0.12); color:var(--switch); }
  .plat-zen { background:rgba(245,196,0,0.12); color:var(--acc); }
  .game-price { font-family:'Rajdhani',sans-serif; font-weight:600; font-size:0.95rem; min-width:75px; text-align:right; flex-shrink:0; color:#fff; }
  .sw2-badge { font-size:0.6rem; background:rgba(232,64,64,0.25); color:#ff6b6b; padding:1px 5px; border-radius:3px; letter-spacing:1px; font-family:'Rajdhani',sans-serif; font-weight:700; flex-shrink:0; }
  .no-results { padding:3rem 1.5rem; text-align:center; color:var(--muted); font-size:0.85rem; display:none; }

  /* TOGGLE ADMIN */
  .toggle-btn {
    width:40px; height:22px; border-radius:11px; border:none; cursor:pointer;
    flex-shrink:0; position:relative; transition:background 0.2s; outline:none;
  }
  .toggle-btn.on { background:#00c896; }
  .toggle-btn.off { background:#3a3a4a; }
  .toggle-btn::after {
    content:''; position:absolute; top:3px;
    width:16px; height:16px; border-radius:50%; background:#fff; transition:left 0.2s;
  }
  .toggle-btn.on::after { left:21px; }
  .toggle-btn.off::after { left:3px; }

  /* ADMIN MODAL */
  .modal-overlay {
    display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.85); z-index:100;
    align-items:center; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:2rem; width:300px; text-align:center;
  }
  .modal h2 { font-family:'Rajdhani',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:0.25rem; color:#fff; }
  .modal p { font-size:0.8rem; color:var(--muted); margin-bottom:1.25rem; }
  .modal input {
    width:100%; background:var(--bg); border:1px solid var(--border);
    border-radius:6px; padding:0.6rem 1rem; color:var(--text);
    font-family:'Barlow',sans-serif; font-size:0.95rem; outline:none;
    text-align:center; letter-spacing:2px; margin-bottom:1rem;
  }
  .modal-btns { display:flex; gap:8px; }
  .btn-cancel { flex:1; padding:0.6rem; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'Barlow',sans-serif; }
  .btn-enter { flex:1; padding:0.6rem; border-radius:6px; border:none; background:var(--ps4); color:#fff; cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1rem; }
  .modal-error { font-size:0.8rem; color:#e84040; margin-top:0.5rem; display:none; }

  /* ADMIN BAR */
  .admin-bar {
    display:none; background:#1a1a0a; border-bottom:1px solid rgba(245,196,0,0.2);
    padding:0.5rem 1.5rem; align-items:center; justify-content:space-between;
  }
  .admin-bar.visible { display:flex; }
  .admin-label { font-size:0.75rem; color:var(--acc); letter-spacing:2px; font-family:'Rajdhani',sans-serif; font-weight:700; }
  .btn-exit-admin { font-size:0.75rem; color:var(--muted); background:transparent; border:1px solid var(--border); border-radius:4px; padding:3px 10px; cursor:pointer; font-family:'Barlow',sans-serif; }

  footer {
    position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:1px solid var(--border);
    padding:0.6rem 1.5rem; display:flex; align-items:center; justify-content:space-between;
    font-size:0.72rem; color:var(--muted);
  }
  .footer-admin-btn {
    background:transparent; border:1px solid rgba(245,196,0,0.3);
    color:rgba(245,196,0,0.6); border-radius:4px; padding:3px 10px;
    cursor:pointer; font-size:0.7rem; font-family:'Barlow',sans-serif;
  }
</style>
</head>

function loadState() {
  ["ps4","ps5","switch","acc"].forEach(tab => {
    const key = "pgState_" + tab;
    const saved = localStorage.getItem(key);
    if (saved) {
      const states = JSON.parse(saved);
      const arr = datasets[tab];
      states.forEach((s, i) => { if (arr[i]) arr[i].active = s; });
    }
  });
}

function saveState(tab) {
  const arr = datasets[tab];
  localStorage.setItem("pgState_" + tab, JSON.stringify(arr.map(g => g.active)));
}

function platClass(p) {
  if (p==="PS4") return "plat-ps4";
  if (p==="PS5") return "plat-ps5";
  if (p==="SWITCH 2") return "plat-sw2";
  if (p==="SWITCH") return "plat-switch";
  if (p==="NINTENDO") return "plat-nintendo";
  if (p==="ZEN") return "plat-zen";
  return "plat-ps4";
}
function dotClass(tab, plat, active) {
  if (!active) return "dot dot-off";
  if (tab==="ps4") return "dot dot-ps4";
  if (tab==="ps5") return "dot dot-ps5";
  if (tab==="switch") return plat==="SWITCH 2" ? "dot dot-sw2" : "dot dot-switch";
  return "dot dot-acc";
}

function render(tab, query) {
  const data = datasets[tab];
  const list = document.getElementById("list-" + tab);
  const noRes = document.getElementById("no-" + tab);
  const countEl = document.getElementById("count-" + tab);
  const q = (query||"").toLowerCase();

  const filtered = data.filter(g => {
    const matchSearch = g.name.toLowerCase().includes(q) || g.platform.toLowerCase().includes(q);
    if (isAdmin) return matchSearch;
    return matchSearch && g.active;
  });

  const activeCount = filtered.filter(g => g.active).length;
  if (isAdmin) {
    countEl.textContent = filtered.length + " producto(s) · " + activeCount + " activos";
  } else {
    countEl.textContent = filtered.length + " producto(s) disponible(s)";
  }

  if (filtered.length === 0) {
    list.innerHTML = "";
    noRes.style.display = "block";
    return;
  }
  noRes.style.display = "none";

  list.innerHTML = filtered.map((g, i) => {
    const realIdx = data.indexOf(g);
    const sw2badge = g.platform==="SWITCH 2" ? '<span class="sw2-badge">SW2</span>' : "";
    const toggleBtn = isAdmin
      ? `<button class="toggle-btn ${g.active ? 'on' : 'off'}" onclick="toggleItem('${tab}',${realIdx})"></button>`
      : "";
    const inactiveClass = !g.active ? " inactive" : "";
    return `<div class="game-item${inactiveClass}">
      <div class="${dotClass(tab, g.platform, g.active)}"></div>
      <span class="game-name">${g.name}</span>
      ${sw2badge}
      <span class="game-platform ${platClass(g.platform)}">${g.platform}</span>
      <span class="game-price">${g.price}</span>
      ${toggleBtn}
    </div>`;
  }).join("");
}

function renderActive(q) {
  render(activeTab, q || document.getElementById("search").value);
}

function toggleItem(tab, idx) {
  datasets[tab][idx].active = !datasets[tab][idx].active;
  saveState(tab);
  renderActive();
}

// TABS
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    activeTab = t.dataset.tab;
    document.getElementById("panel-" + activeTab).classList.add("active");
    renderActive();
  });
});

document.getElementById("search").addEventListener("input", e => renderActive(e.target.value));

// MODAL
function openModal() {
  document.getElementById("modalOverlay").classList.add("open");
  document.getElementById("passInput").value = "";
  document.getElementById("passError").style.display = "none";
  setTimeout(() => document.getElementById("passInput").focus(), 100);
}
function closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
}
function checkPass() {
  const val = document.getElementById("passInput").value;
  if (val === PASS) {
    isAdmin = true;
    closeModal();
    document.getElementById("adminBar").classList.add("visible");
    ["ps4","ps5","switch","acc"].forEach(t => render(t, ""));
    renderActive();
  } else {
    document.getElementById("passError").style.display = "block";
  }
}
function exitAdmin() {
  isAdmin = false;
  document.getElementById("adminBar").classList.remove("visible");
  ["ps4","ps5","switch","acc"].forEach(t => render(t, ""));
  renderActive();
}

// INIT
loadState();
["ps4","ps5","switch","acc"].forEach(t => render(t, ""));
</script>
</body>
</html>
