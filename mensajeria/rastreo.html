<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rastreo - Prueba</title>
<meta name="description" content="Sigue tu pedido en tiempo real con tu número de guía.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="estilos.css?v=20261112t">
<style>
.envoltura{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.buscar{display:flex;gap:8px;flex-wrap:wrap}
.buscar #guia{flex:1 1 12em;min-width:0}
.buscar input{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
#mapa{height:min(46vh,420px);min-height:260px}
.estado-grande{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1}
.pie{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main class="envoltura">
  <header><h1><a href="rastreo.html" id="inicio" style="color:inherit;text-decoration:none">Rastreo - <span class="marca">Prueba</span></a></h1><p class="nota" style="margin:4px 0 0">Abre el enlace que te enviamos, o escribe tu número de guía y los últimos 4 dígitos de tu celular.</p></header>
  <form class="buscar" id="fBuscar">
    <input id="guia" placeholder="PIPEGAMES-00001" autocomplete="off" aria-label="Número de guía" required>
    <input id="clave" placeholder="Últimos 4 de tu celular" inputmode="numeric" autocomplete="off" aria-label="Últimos 4 dígitos de tu celular" maxlength="6" required style="flex:1 1 9em;min-width:0">
    <button class="btn" type="submit">Rastrear</button>
  </form>
  <p class="nota" style="margin:-6px 0 0">Si tu pedido no tiene celular registrado, escribe el código de 6 caracteres que aparece en la etiqueta.</p>
  <div id="salida"></div>
  <button class="btn sec" id="otra" hidden>Buscar otra guía</button>
  <div id="mapa" class="mapa" hidden></div>
  <div id="salida2"></div>
  <p class="pie">Rastreo - Prueba · Bogotá</p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { firebaseConfig, FIREBASE_VERSION } from "./config.js?v=20261112t";
import * as C from "./comun.js?v=20261112t";
const V = FIREBASE_VERSION;
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const { getFirestore, doc, onSnapshot } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const db = getFirestore(initializeApp(firebaseConfig));
const $ = s => document.querySelector(s);
const { esc } = C;

let unsubG = null, unsubU = null, g = null, u = null, foto = null, mapa = null, capa = null, ajustado = "";

$("#fBuscar").onsubmit = e => { e.preventDefault(); buscar($("#guia").value, $("#clave").value); };
const qs = new URLSearchParams(location.search);
if (qs.get("g")) { $("#guia").value = qs.get("g"); if (qs.get("c")) buscar(qs.get("g"), qs.get("c")); else $("#clave").focus(); }

// Volver al inicio: borrar la guía consultada para buscar otra.
function limpiar() {
  unsubG?.(); unsubU?.(); unsubG = unsubU = null; g = u = foto = null; ajustado = "";
  $("#salida").innerHTML = ""; $("#salida2").innerHTML = ""; $("#mapa").hidden = true; $("#otra").hidden = true;
  $("#guia").value = ""; $("#clave").value = ""; history.replaceState(null, "", location.pathname);
  window.scrollTo({ top: 0, behavior: "smooth" }); $("#guia").focus();
}
$("#otra").onclick = limpiar;
$("#inicio").onclick = e => { e.preventDefault(); limpiar(); };
function buscar(raw, rawClave) {
  const n = String(raw || "").trim().toUpperCase().replace(/\s+/g, "");
  const c = String(rawClave || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!n) return;
  $("#guia").value = n; $("#clave").value = c;
  if (!/^[A-Z0-9-]+$/.test(n) || !/^([0-9]{4}|[A-Z0-9]{6})$/.test(c)) { $("#salida").innerHTML = `<div class="vacio error">Escribe tu número de guía y los últimos 4 dígitos de tu celular (o el código de 6 caracteres de la etiqueta).</div>`; return; }
  history.replaceState(null, "", "?g=" + encodeURIComponent(n) + "&c=" + encodeURIComponent(c));
  unsubG?.(); unsubU?.(); g = u = foto = null; ajustado = "";
  $("#salida").innerHTML = `<div class="vacio">Buscando ${esc(n)}…</div>`; $("#salida2").innerHTML = ""; $("#mapa").hidden = true; $("#otra").hidden = false;
  unsubG = onSnapshot(doc(db, "rastreo", n + "_" + c), s => {
    if (!s.exists()) { g = null; $("#mapa").hidden = true; $("#salida2").innerHTML = ""; $("#salida").innerHTML = `<div class="vacio error">No encontramos la guía <span class="guia">${esc(n)}</span> con esos datos. Revisa el número de guía y los últimos 4 dígitos del celular que registraste en la compra.</div>`; return; }
    const antes = g;
    g = s.data();
    seguirMensajero(antes);
    foto = g.estado === "entregada" ? (g.foto || "sin") : null;
    pintar();
  }, () => { $("#mapa").hidden = true; $("#salida").innerHTML = `<div class="vacio error">No pudimos consultar la guía. Revisa tu conexión e intenta de nuevo.</div>`; });
}
function seguirMensajero(antes) {
  const enRuta = g && g.mensajeroId && g.estado === "en_camino";
  if (antes && antes.mensajeroId === g.mensajeroId && !!unsubU === !!enRuta) return;
  unsubU?.(); unsubU = null; u = null;
  if (enRuta) unsubU = onSnapshot(doc(db, "ubicaciones", g.mensajeroId), s => { u = s.exists() ? s.data() : null; pintar(); }, () => { u = null; pintar(); });
}
const titular = {
  disponible: "Preparando tu envío", tomada: "Mensajero asignado", recogida: "Tu pedido fue recogido",
  en_camino: "Tu pedido va en camino", entregada: "Pedido entregado", novedad: "Tu envío tiene una novedad",
  devuelta: "El envío fue devuelto a la tienda", cancelada: "Este envío fue cancelado"
};
function pintar() {
  if (!g) return;
  const enRuta = g.estado === "en_camino" && u && u.enTurno && u.lat != null;
  const d = enRuta ? C.km(u, g.destino) : null;
  const pasos = C.PASOS.map(k => {
    const e = [...(g.eventos || [])].reverse().find(x => x.estado === k);
    const i = C.PASOS.indexOf(g.estado), j = C.PASOS.indexOf(k);
    const cls = i < 0 ? (e ? "hecho" : "") : j < i ? "hecho" : j === i ? "ahora" : "";
    const etiqueta = { disponible: "Guía creada", tomada: "Mensajero asignado", recogida: "Paquete recogido", en_camino: "En camino", entregada: "Entregado" }[k];
    return `<li class="${cls}"><div>${etiqueta}</div><div></div><div class="t">${e ? C.fecha(e.t) : ""}</div></li>`;
  }).join("");
  const extra = (g.eventos || []).filter(e => ["novedad", "devuelta", "cancelada"].includes(e.estado)).map(e => `<li class="mal"><div>${C.ESTADOS[e.estado]}</div><div></div><div class="t">${C.fecha(e.t)}</div></li>`).join("");
  $("#salida").innerHTML = `
    <div class="panel">
      <div class="item" style="border:0;padding:0"><div class="arriba"><span class="guia">${esc(g.numero)}</span><span class="pill ${g.estado}">${C.ESTADOS[g.estado]}</span></div></div>
      <div class="estado-grande">${titular[g.estado] || C.ESTADOS[g.estado]}</div>
      ${enRuta ? `<div class="cifras"><div><b>${d.toFixed(1)} km</b><span>Distancia al destino</span></div><div><b>~${Math.max(3, Math.round(d / 18 * 60))} min</b><span>Tiempo aproximado</span></div><div><b>${C.hace(u.t)}</b><span>Última ubicación</span></div></div>` : ""}
      <dl class="kv">
        <dt>Para</dt><dd>${esc(g.clienteNombre)} · ${esc(g.localidad)}</dd>
        <dt>Tienda</dt><dd>${esc(g.remitente)}</dd>
        ${g.mensajeroNombre ? `<dt>Mensajero</dt><dd>${esc(C.primerNombre(g.mensajeroNombre))}${g.mensajeroPlaca ? " · placa " + esc(g.mensajeroPlaca) : ""}</dd>` : ""}
        ${g.recibe ? `<dt>Recibió</dt><dd>${esc(C.RECIBE[g.recibe] || "")}</dd>` : ""}
        <dt>Cobro</dt><dd>${g.valor ? "Pagas " + C.cop(g.valor) + " al recibir (efectivo o Nequi)" : "Sin cobro"}</dd>
      </dl>
    </div>
`;
  $("#salida2").innerHTML = `
    ${g.estado === "entregada" ? (foto && foto !== "sin" ? `<div class="panel"><h3>${(g.fotosExtra || []).length ? "Fotos de entrega" : "Foto de entrega"}</h3><div class="fotos-entrega">${[foto, ...(g.fotosExtra || [])].map((f, i) => `<img class="foto-entrega" alt="Foto ${i + 1} de la entrega del pedido" src="${f}">`).join("")}</div></div>` : foto === "sin" ? "" : `<div class="vacio">Cargando foto de entrega…</div>`) : ""}
    <div class="panel"><h3>Historial</h3><ol class="tl">${pasos}${extra}</ol></div>`;
  pintarMapa(enRuta);
}
function pintarMapa(enRuta) {
  const el = $("#mapa");
  el.hidden = ["entregada", "cancelada", "devuelta"].includes(g.estado);
  if (el.hidden) return;
  if (!mapa) { mapa = L.map(el); C.capaMapa(L).addTo(mapa); capa = L.layerGroup().addTo(mapa); }
  setTimeout(() => mapa.invalidateSize(), 50);
  capa.clearLayers();
  const pts = [];
  if (g.destino) { L.marker([g.destino.lat, g.destino.lng], { icon: C.icono(L, "destino", "") }).bindTooltip("Destino").addTo(capa); pts.push([g.destino.lat, g.destino.lng]); }
  if (enRuta) {
    L.marker([u.lat, u.lng], { icon: C.icono(L, "mensajero", C.iniciales(g.mensajeroNombre)), zIndexOffset: 500 }).bindTooltip("Tu mensajero").addTo(capa);
    L.polyline([[u.lat, u.lng], [g.destino.lat, g.destino.lng]], { color: getComputedStyle(document.documentElement).getPropertyValue("--route").trim(), weight: 3, dashArray: "6 7" }).addTo(capa);
    pts.push([u.lat, u.lng]);
  }
  const clave = g.numero + g.estado + pts.length;
  if (clave === ajustado) return;
  ajustado = clave;
  if (pts.length > 1) mapa.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 16 });
  else if (pts.length === 1) mapa.setView(pts[0], 14);
  else mapa.setView([C.BOGOTA.lat, C.BOGOTA.lng], 11);
}
</script>
</body>
</html>
