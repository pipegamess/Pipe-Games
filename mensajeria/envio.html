<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Datos de envío - Prueba</title>
<meta name="description" content="Escribe tus datos de entrega para que te enviemos tu pedido.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="estilos.css?v=20261112z">
<style>
.envoltura{max-width:620px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
#mapa{height:min(42vh,360px);min-height:240px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.fila{grid-template-columns:1fr}}
.sug-caja{position:relative}
.sugerencias{position:absolute;left:0;right:0;top:100%;z-index:1200;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:300px;overflow-y:auto}
.sugerencias button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 12px;font:inherit}
.sugerencias button:last-child{border-bottom:0}
.sugerencias button:hover{background:var(--chip)}
.sugerencias .t2{font-size:12px;color:var(--muted)}
.estado-pin{font-size:13px;color:var(--muted)}
.estado-pin.ok{color:var(--ok);font-weight:600}
.estado-pin.mal{color:var(--bad);font-weight:600}
.listo{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.pie{font-size:12px;color:var(--muted);text-align:center}
.opciones{display:flex;flex-direction:column;gap:6px}
.op{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.op.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.op .rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.op.on .rad{border-color:var(--accent)}
.op.on .rad::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.op .info{flex:1;min-width:0;display:flex;flex-direction:column}
.op small{color:var(--muted);font-size:12px;font-weight:400}
.op .v{text-align:right;font-weight:700;white-space:nowrap}
</style>
</head>
<body>
<main class="envoltura">
  <header style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px"><img src="logo-pipegames.jpg" alt="Pipe Games" width="120" height="120" style="width:120px;height:120px;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.18)"><h1 style="text-transform:uppercase;color:var(--ink);margin:4px 0 0">Datos de envío</h1><p class="nota" id="intro" style="margin:4px 0 0">Escribe a dónde te enviamos tu pedido. Tarda menos de un minuto.</p></header>
  <div id="resumen"></div>
  <form class="panel" id="fEnvio" novalidate>
    <label>Nombre de quien recibe<input id="eNom" autocomplete="name" maxlength="80" required></label>
    <label>Celular<input id="eTel" type="tel" inputmode="numeric" autocomplete="tel" maxlength="16" required></label>
    <label>Correo electrónico<input id="eMail" type="email" inputmode="email" autocomplete="email" maxlength="100" placeholder="nombre@correo.com" required></label>
    <div class="sug-caja"><label>Ciudad o municipio<input id="eCiudad" autocomplete="off" maxlength="80" placeholder="Escribe tu ciudad o municipio" required></label><div class="sugerencias" id="eCiudadSug" hidden></div></div>
    <div id="eTransp" hidden></div>
    <div class="sug-caja"><label>Dirección<input id="eDir" autocomplete="off" maxlength="120" placeholder="Ej. Calle 26 # 68-10" required></label><div class="sugerencias" id="eSug" hidden></div></div>
    <div class="fila">
      <label>Complemento de la dirección<input id="eComp" maxlength="80" placeholder="Torre, apartamento, casa…" required></label>
      <label>Barrio<input id="eBarrio" maxlength="60" placeholder="Ej. Modelia" required></label>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px" id="secMapa" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:14px">Tu ubicación en el mapa</b><button class="btn sec chico" type="button" id="eGps">📍 Usar mi ubicación</button></div>
      <div id="mapa" class="mapa"></div>
      <div class="estado-pin" id="ePin">Escribe la dirección o toca “Usar mi ubicación”. Luego revisa que el punto quede en tu casa; puedes moverlo o tocar el mapa.</div>
    </div>
    <div class="error" id="eErr"></div>
    <button class="btn btn-turno" type="submit" id="eBtn">Enviar mis datos</button>
  </form>
  <div id="salida"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { firebaseConfig, FIREBASE_VERSION, TOMTOM_KEY } from "./config.js?v=20261112z";
import * as C from "./comun.js?v=20261112z";
import * as T from "./tarifas-envio.js?v=20261112z";
const V = FIREBASE_VERSION;
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const { getFirestore, doc, getDoc, setDoc } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const db = getFirestore(initializeApp(firebaseConfig));
const $ = s => document.querySelector(s);
const { esc } = C;
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

// Si el navegador entregó una copia vieja del formulario, cargar la publicada
const VERSION_FORM = "20261112z";
fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(j => {
  if (String(j.v || "") > VERSION_FORM) { const u = new URL(location.href); if (u.searchParams.get("v") !== j.v) { u.searchParams.set("v", j.v); location.replace(u.toString()); } }
}).catch(() => {});
const pedido = new URLSearchParams(location.search).get("p") || null;
let pin = null, marcador = null, envioFijo = 0, contenidoPre = "";

/* ---------- pedido preparado por despacho (link personalizado) ---------- */
if (pedido) {
  try {
    const p = await getDoc(doc(db, "prepedidos", pedido));
    if (!p.exists()) { cerrado("Este enlace no es válido. Pídele a la tienda uno nuevo."); }
    else {
      const d = p.data();
      if (d.usado) {
        cerrado("Este enlace ya se usó. Tu envío ya está creado.");
      } else if (d.envio) {
        // Producto grande: costo de envío fijado por la tienda para otras ciudades
        envioFijo = +d.envio || 0; contenidoPre = d.contenido || "";
      } else if (d.contenido || d.valor) {
        $("#resumen").innerHTML = `<div class="panel"><dl class="kv">${d.contenido ? `<dt>Tu pedido</dt><dd>${esc(d.contenido)}</dd>` : ""}<dt>Pago</dt><dd>${d.valor ? "Pagas " + C.cop(d.valor) + " al recibir (efectivo o Nequi)" : "Ya está pago"}</dd></dl></div>`;
      }
    }
  } catch { /* si falla la lectura, el formulario sigue funcionando */ }
}
function resumen() {
  if (!envioFijo) return;
  // Solo el pedido: el costo del envío se ve al elegir la transportadora
  $("#resumen").innerHTML = contenidoPre ? `<div class="panel"><dl class="kv"><dt>Tu pedido</dt><dd>${esc(contenidoPre)}</dd></dl></div>` : "";
}
function cerrado(html, link) {
  $("#fEnvio").hidden = true; $("#intro").hidden = true;
  $("#salida").innerHTML = `<div class="panel"><div>${html}</div>${link ? `<a class="btn" href="${esc(link)}">Rastrear mi pedido</a>` : ""}</div>`;
}

/* ---------- mapa ---------- */
const mapa = L.map("mapa", { zoomControl: true });
C.capaMapa(L).addTo(mapa);
mapa.setView([C.BOGOTA.lat, C.BOGOTA.lng], 11);
/* ---------- ciudad: Bogotá, Chía y Soacha con mapa (mensajero propio); el resto del país por transportadora ---------- */
const LOCALES = { bogota: "bogota", chia: "chia", soacha: "soacha" };
let env = T.envioDeCiudad($("#eCiudad").value), transp = "";
function claveLocal(e) {
  if (e.tipo !== "local") return "";
  const k = T.envNorm(e.ciudad.split(" - ")[0]);
  return LOCALES[k] || (k.startsWith("bogota") ? "bogota" : "");
}
const ciudad = () => C.ciudadDeTexto($("#eDir").value) || claveLocal(env) || "bogota";
const esNacional = () => ["nacional", "otro"].includes(env.tipo);
resumen();
function pintarCiudad() {
  const antes = claveLocal(env);
  env = T.envioDeCiudad($("#eCiudad").value);
  const local = claveLocal(env), nac = esNacional();
  resumen();
  $("#secMapa").hidden = !local;
  if (local) { setTimeout(() => mapa.invalidateSize(), 30); if (local !== antes && !pin) { const c = C.CIUDADES[local]; mapa.setView([c.centro.lat, c.centro.lng], 13); } }
  const box = $("#eTransp");
  if (!nac) {
    box.hidden = !(env.tipo === "invalido" && T.envNorm($("#eCiudad").value).length >= 2);
    box.innerHTML = env.multi ? `<div class="aviso">Hay varios municipios con ese nombre. Elige el tuyo en la lista.</div>` : `<div class="aviso">Escribe tu municipio y elígelo de la lista.</div>`;
    return;
  }
  // Con link de producto grande, las dos transportadoras muestran el costo que fijó la tienda
  const ops = T.ENVIO_TRANSP.map(t => ({ id: t.id, n: t.n, v: envioFijo ? envioFijo : env.tipo === "nacional" ? env.opciones.find(o => o.id === t.id)?.v : undefined }));
  const disponibles = ops.filter(o => o.v !== null);
  if (!disponibles.some(o => o.id === transp)) transp = "";
  box.hidden = false;
  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px"><b style="font-size:14px">¿Con qué transportadora te lo enviamos?</b>
    <div class="opciones">${ops.map(o => o.v === null
      ? `<div class="op" style="opacity:.5;cursor:default"><span class="rad"></span><span class="info"><b>${esc(o.n)}</b><small>No llega a ${esc(env.ciudad.split(" - ")[0])}</small></span></div>`
      : `<button type="button" class="op${o.id === transp ? " on" : ""}" data-tr="${o.id}"><span class="rad"></span><span class="info"><b>${esc(o.n)}</b><small>Envío a ${esc(env.ciudad)}</small></span><span class="v">${o.v ? C.cop(o.v) : "<small>Valor por confirmar</small>"}</span></button>`).join("")}</div>
    <span class="nota">Te avisamos por WhatsApp cuando lo despachemos, con tu número de guía.</span></div>`;
}
$("#eTransp").addEventListener("click", e => { const b = e.target.closest("[data-tr]"); if (!b) return; transp = b.dataset.tr; $("#eErr").textContent = ""; pintarCiudad(); });
$("#eCiudad").addEventListener("focus", () => $("#eCiudad").select());
$("#eCiudad").addEventListener("input", () => { sugerirCiudad(); pintarCiudad(); });
$("#eCiudad").addEventListener("blur", () => setTimeout(() => {
  const r = T.envBuscar($("#eCiudad").value);
  if (r?.x && $("#eCiudad").value !== T.envEtiqueta(r.x)) $("#eCiudad").value = T.envEtiqueta(r.x);
  $("#eCiudadSug").hidden = true; pintarCiudad();
}, 150));
function sugerirCiudad() {
  const box = $("#eCiudadSug"), v = $("#eCiudad").value;
  let n = T.envNorm(v.split(" - ")[0]); n = T.ENVIO_ALIAS[n] || n;
  const r = T.envBuscar(v);
  if (n.length < 2 || (r?.x && v.includes(" - "))) { box.hidden = true; return; }
  const score = m => (m.k === n ? 0 : m.k.startsWith(n) ? 1 : 2) * 10 + (m.tar ? 0 : 1);
  const res = T.ENVIO_MUNI.filter(m => m.k.startsWith(n) || m.k.split(" ").some(w => w.startsWith(n)) || (m.k === "bogota" && n.startsWith("bogota ")))
    .sort((a, b) => score(a) - score(b) || a.k.localeCompare(b.k)).slice(0, 7);
  box.innerHTML = res.length ? res.map(m => `<button type="button" data-k="${esc(m.key)}"><b>${esc(m.c)}</b><span class="t2">${esc(m.d)}</span></button>`).join("") : `<div class="nota" style="padding:10px 12px">No encontramos ese municipio. Revisa cómo está escrito.</div>`;
  box.hidden = false;
}
$("#eCiudadSug").addEventListener("pointerdown", e => e.preventDefault());
$("#eCiudadSug").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  const m = T.ENVIO_MUNI.find(x => x.key === b.dataset.k);
  $("#eCiudad").value = T.envEtiqueta(m); $("#eCiudadSug").hidden = true; pintarCiudad(); ultima = ""; buscar();
});
function ponerPin(p, texto, clase = "ok") {
  pin = { lat: +p.lat, lng: +p.lng };
  if (!marcador) {
    marcador = L.marker([pin.lat, pin.lng], { draggable: true, icon: C.icono(L, "destino", "") }).addTo(mapa);
    marcador.on("dragend", () => { const ll = marcador.getLatLng(); pin = { lat: ll.lat, lng: ll.lng }; estadoPin("Punto ajustado. Así llegará el mensajero.", "ok"); });
  } else marcador.setLatLng([pin.lat, pin.lng]);
  mapa.setView([pin.lat, pin.lng], 17);
  estadoPin(texto, clase);
}
const estadoPin = (t, c = "") => { $("#ePin").className = "estado-pin " + c; $("#ePin").textContent = t; };
mapa.on("click", e => ponerPin(e.latlng, "Punto marcado. Puedes arrastrarlo si hace falta."));

/* ---------- búsqueda de dirección (TomTom) ---------- */
async function tomtom(texto, modo) {
  const c = C.CIUDADES[ciudad()], [s, w, n, e] = c.bbox;
  const limpio = C.quitarCiudad(texto), nd = C.normalizarDireccion(limpio);
  const q = (nd.via ? nd.texto.replace(/\s*#\s*/, " ") : limpio) + ", " + c.consulta;
  const url = `https://api.tomtom.com/search/2/${modo === "geocode" ? "geocode" : "search"}/${encodeURIComponent(q)}.json?key=${TOMTOM_KEY}&countrySet=CO&language=es-419&limit=5&lat=${c.centro.lat}&lon=${c.centro.lng}&topLeft=${n},${w}&btmRight=${s},${e}${modo === "geocode" ? "" : "&typeahead=true&idxSet=Addr,Str,PAD,POI,Geo"}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("TomTom " + r.status);
  const j = await r.json();
  return (j.results || []).filter(x => x.position).map(x => ({ lat: x.position.lat, lng: x.position.lon, t1: x.poi?.name || (x.address?.freeformAddress || "").replace(/,\s*(Bogotá|Bogota|Soacha|Chía|Chia)(,.*)?$/i, ""), t2: [x.address?.municipalitySubdivision, x.address?.municipality].filter(Boolean).join(", ") }));
}
let timer = null, ultima = "";
$("#eDir").addEventListener("input", () => {
  if (!claveLocal(env)) return; // fuera de Bogotá, Chía y Soacha no hay mapa
  clearTimeout(timer); timer = setTimeout(buscar, 650);
});
async function buscar() {
  const t = $("#eDir").value.trim();
  if (!claveLocal(env)) return;
  if (t.length < 5 || t + ciudad() === ultima) return;
  ultima = t + ciudad();
  let l = [];
  try { l = await tomtom(t, "search"); } catch {}
  if ($("#eDir").value.trim() !== t) return;
  const caja = $("#eSug");
  if (!l.length) { caja.hidden = true; return; }
  caja.innerHTML = l.map((x, i) => `<button type="button" data-i="${i}"><span>${esc(x.t1)}</span><span class="t2">${esc(x.t2)}</span></button>`).join("");
  caja.hidden = false;
  caja.onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; const x = l[+b.dataset.i]; caja.hidden = true; ponerPin(x, "Revisa que el punto quede en tu casa. Si no, arrástralo o toca el mapa en el sitio correcto."); };
}
document.addEventListener("click", e => { if (!e.target.closest(".sug-caja")) { $("#eSug").hidden = true; $("#eCiudadSug").hidden = true; } });
// Si no eligió sugerencia, ubicar al salir del campo
$("#eDir").addEventListener("change", async () => {
  if (pin || !claveLocal(env)) return;
  try { const r = await tomtom($("#eDir").value.trim(), "geocode"); if (r[0] && !pin) ponerPin(r[0], "Ubicación aproximada: revisa que el punto quede en tu casa y muévelo si hace falta.", ""); } catch {}
});

/* ---------- mi ubicación ---------- */
$("#eGps").onclick = () => {
  if (!navigator.geolocation) { estadoPin("Tu navegador no permite compartir la ubicación. Marca el punto en el mapa.", "mal"); return; }
  estadoPin("Buscando tu ubicación…");
  navigator.geolocation.getCurrentPosition(async pos => {
    ponerPin({ lat: pos.coords.latitude, lng: pos.coords.longitude }, `Ubicación tomada del celular (precisión ${Math.round(pos.coords.accuracy)} m). Revisa el punto.`);
    if (!$("#eDir").value.trim()) {
      try {
        const r = await fetch(`https://api.tomtom.com/search/2/reverseGeocode/${pos.coords.latitude},${pos.coords.longitude}.json?key=${TOMTOM_KEY}&language=es-419`);
        const a = (await r.json()).addresses?.[0]?.address;
        if (a?.streetNameAndNumber || a?.street) $("#eDir").value = a.streetNameAndNumber || a.street;
        if (a?.municipalitySubdivision && !$("#eBarrio").value) $("#eBarrio").value = a.municipalitySubdivision;
      } catch {}
    }
  }, () => estadoPin("No pudimos leer tu ubicación. Revisa que el GPS esté activado o marca el punto en el mapa.", "mal"), { enableHighAccuracy: true, timeout: 15000 });
};

/* ---------- enviar ---------- */
$("#fEnvio").onsubmit = async e => {
  e.preventDefault(); $("#eErr").textContent = "";
  const tel = $("#eTel").value.replace(/\D/g, "").replace(/^57(?=3\d{9}$)/, "");
  env = T.envioDeCiudad($("#eCiudad").value);
  const nac = esNacional();
  const datos = {
    nombre: $("#eNom").value.trim(), telefono: tel, correo: $("#eMail").value.trim().toLowerCase(), ciudad: nac ? "nacional" : ciudad(),
    direccion: nac ? $("#eDir").value.trim() : C.quitarCiudad($("#eDir").value.trim()), complemento: $("#eComp").value.trim(), barrio: $("#eBarrio").value.trim(),
    lat: nac ? null : pin?.lat ?? null, lng: nac ? null : pin?.lng ?? null, pedido, estado: "nueva", creado: Date.now()
  };
  if (nac) { datos.municipio = env.ciudad; datos.transportadora = transp; }
  if (datos.nombre.length < 2) return error("Escribe el nombre de quien recibe.", "#eNom");
  if (!/^\d{10}$/.test(tel)) return error("Escribe un celular de 10 dígitos.", "#eTel");
  if (!datos.correo) return error("Escribe tu correo electrónico.", "#eMail");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(datos.correo)) return error("Revisa el correo electrónico.", "#eMail");
  if (!nac && !claveLocal(env)) return error("Escribe tu ciudad o municipio y elígelo de la lista.", "#eCiudad");
  const otra = !nac && C.ciudadEnDireccion(T, $("#eDir").value, $("#eBarrio").value);
  if (otra) { $("#eCiudad").value = T.envEtiqueta(otra); pintarCiudad(); return error(`Tu dirección es en ${otra.c}: cambiamos la ciudad. Elige la transportadora y envía otra vez.`); }
  if (nac && !transp) return error("Elige con qué transportadora te lo enviamos.");
  if (datos.direccion.length < 4) return error("Escribe la dirección.", "#eDir");
  if (datos.complemento.length < 1) return error("Escribe el complemento de la dirección (torre, apartamento o casa).", "#eComp");
  if (datos.barrio.length < 2) return error("Escribe el barrio.", "#eBarrio");
  if (!nac && !pin) return error("Marca tu ubicación en el mapa: toca “Usar mi ubicación” o toca el mapa en tu casa.");
  const b = $("#eBtn"); b.disabled = true; b.textContent = "Enviando…";
  try {
    const id = C.nuevoCodigo() + C.nuevoCodigo() + C.nuevoCodigo();
    await setDoc(doc(db, "solicitudes", id), datos);
    listo();
  } catch (err) { error("No se pudo enviar. Revisa tu conexión e intenta de nuevo."); b.disabled = false; b.textContent = "Enviar mis datos"; }
};
function error(t, foco) { $("#eErr").textContent = t; if (foco) $(foco).focus(); }

function listo() {
  $("#fEnvio").hidden = true; $("#resumen").hidden = true; $("#intro").hidden = true;
  $("#salida").innerHTML = `<div class="panel"><div class="listo">¡Listo! Tu envío está creado</div><p class="nota" style="margin:0">Gracias. Ya tenemos tus datos de entrega.</p></div>`;
}
</script>
</body>
</html>
