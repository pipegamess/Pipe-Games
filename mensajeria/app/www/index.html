<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mensajería Prueba</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="estilos.css">
<style>
body{padding-top:env(safe-area-inset-top,0px)}
.pantalla{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.barra-abajo{position:fixed;left:0;right:0;bottom:0;z-index:1500;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.barra-abajo a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:14px;position:relative}
.barra-abajo a[aria-current="page"]{color:var(--ink);background:var(--chip)}
.barra-abajo svg{width:22px;height:22px}
.insignia{position:absolute;top:2px;right:calc(50% - 22px);background:var(--accent);color:var(--accent-ink);font-size:11px;font-family:var(--f-body);font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.turno{border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line)}
.turno.activo{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.turno .grande{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1}
.btn-turno{font-size:22px;padding:16px}
.mini-mapa{height:220px}
.volver{align-self:flex-start}
.aviso{background:var(--chip);border-radius:10px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.medios{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.medios label{flex-direction:row;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 6px;color:var(--ink);font-weight:600;background:var(--surface)}
.medios input{width:auto;margin:0}
.medios label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.foto-btn{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:var(--surface);display:block;font-weight:600}
.foto-btn input{display:none}
.saldo{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.cargando{display:grid;place-items:center;min-height:60vh;color:var(--muted)}
.rapidas{display:flex;flex-wrap:wrap;gap:6px}
.btn-escanear{font-size:24px;padding:22px;border-radius:14px}
.recibe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.recibe label{flex-direction:row;justify-content:center;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px 6px;color:var(--ink);font-weight:600;background:var(--surface)}
.recibe input{width:auto;margin:0}
.recibe label:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.manual{display:flex;gap:8px}
.manual input{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em}
.tel{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;background:var(--chip);color:var(--ink);text-decoration:none;font-family:var(--f-mono);font-weight:600;font-size:20px;letter-spacing:.03em}
.tel svg{color:var(--ok);flex:none}
.tel{width:100%;border:0;cursor:pointer;text-align:left}
.contacto{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ruta-mapa{height:300px}
.num-entrega{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:99px;background:var(--route);color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px}
.orden{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.orden select{width:auto;padding:6px 8px}
.rapidas button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 11px;font-size:13px}
</style>
</head>
<body>
<main id="raiz"><div class="cargando" id="cargando">Cargando…</div></main>
<script>
  // Si algo falla al arrancar, mostrarlo en pantalla en vez de quedarse cargando.
  function mostrarFallo(t) {
    var el = document.getElementById("cargando");
    if (el) el.innerHTML = '<div style="max-width:420px;padding:16px;text-align:center"><b>No se pudo abrir la app.</b><br><span style="font-size:13px">' + String(t).replace(/</g, "&lt;") + '</span><br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>';
  }
  window.addEventListener("error", function (e) { mostrarFallo(e.message || "Error desconocido"); });
  window.addEventListener("unhandledrejection", function (e) { mostrarFallo((e.reason && e.reason.message) || e.reason || "Error desconocido"); });
  setTimeout(function () { if (document.getElementById("cargando")) mostrarFallo("La app tarda demasiado en cargar. Revisa que el celular tenga internet."); }, 20000);
</script>
<script src="capacitor.js"></script>
<nav class="barra-abajo" id="barra" hidden>
  <a href="#inicio" data-r="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
  <a href="#disponibles" data-r="disponibles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>Escanear<span class="insignia" id="nDisp" hidden></span></a>
  <a href="#mios" data-r="mios"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mis pedidos<span class="insignia" id="nMios" hidden></span></a>
  <a href="#perfil" data-r="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</a>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { firebaseConfig, FIREBASE_VERSION } from "./config.js";
import * as C from "./comun.js";
const V = FIREBASE_VERSION;
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, where, writeBatch, runTransaction } = F;

const app = initializeApp(firebaseConfig);
const auth = A.initializeAuth(app, { persistence: [A.indexedDBLocalPersistence, A.browserLocalPersistence] });
const db = getFirestore(app);
const $ = s => document.querySelector(s);
const { esc } = C;

/* ---------- plugins nativos ---------- */
const Cap = window.Capacitor;
const nativo = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const registrar = window.capacitorExports?.registerPlugin;
const BG = nativo && registrar ? registrar("BackgroundGeolocation") : null;
const Http = nativo && registrar ? registrar("CapacitorHttp") : null;
const Notif = nativo && registrar ? registrar("LocalNotifications") : null;
const Escaner = nativo && registrar ? registrar("BarcodeScanner") : null;

/* ---------- estado ---------- */
const S = { u: null, perfil: null, disp: [], mios: [], entregas: [], pos: null, turno: false, watcher: null };
let subs = [];
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2800); }
function abrirExterno(url) { window.location.href = url; }

/* ---------- sesión ---------- */
A.onAuthStateChanged(auth, async user => {
  subs.forEach(f => f()); subs = [];
  S.u = user; S.perfil = null;
  if (!user) { $("#barra").hidden = true; if (!location.hash.startsWith("#registro")) location.hash = "#ingreso"; ruta(); return; }
  try {
    const p = await getDoc(doc(db, "usuarios", user.uid));
    if (!p.exists()) { if (S.registrando) return; pantallaMensaje("Tu cuenta no tiene perfil de mensajero", "Pídele a despacho un código de invitación y crea la cuenta desde “Crear cuenta”.", true); return; }
    S.perfil = p.data();
    if (S.perfil.rol !== "mensajero") { pantallaMensaje("Esta cuenta es de despacho", "La app es solo para mensajeros. Despacho usa el panel web.", true); return; }
    if (!S.perfil.activo) { pantallaMensaje("Tu cuenta está desactivada", "Habla con despacho para volver a activarla.", true); return; }
  } catch (e) { pantallaMensaje("No se pudo cargar tu perfil", C.mensajeError(e), true); return; }
  escuchar();
  $("#barra").hidden = false;
  if (!location.hash || ["#ingreso", "#registro"].includes(location.hash)) location.hash = "#inicio";
  if (ls.get("turno") === "1") iniciarTurno(true);
  ruta();
});
function escuchar() {
  const uid = S.u.uid;
  subs.push(onSnapshot(doc(db, "usuarios", uid), s => { if (s.exists()) { S.perfil = s.data(); if (!S.perfil.activo) { terminarTurno(); A.signOut(auth); } } }));
  subs.push(onSnapshot(query(collection(db, "guias"), where("estado", "==", "disponible")), s => { S.disp = s.docs.map(d => ({ numero: d.id, ...d.data() })); ruta(true); }, e => toast(C.mensajeError(e))));
  subs.push(onSnapshot(query(collection(db, "guias"), where("mensajeroId", "==", uid)), s => { S.mios = s.docs.map(d => ({ numero: d.id, ...d.data() })); ruta(true); }, e => toast(C.mensajeError(e))));
  subs.push(onSnapshot(query(collection(db, "entregasDinero"), where("mensajeroId", "==", uid)), s => { S.entregas = s.docs.map(d => d.data()); ruta(true); }, () => {}));
}

/* ---------- ubicación en segundo plano ---------- */
let tok = { v: null, exp: 0 }, ultimoEnvio = { t: 0, lat: 0, lng: 0 }, enviando = false;
async function token() {
  if (tok.v && Date.now() < tok.exp - 5 * 60000) return tok.v;
  try {
    // Primero intenta el SDK (funciona con la app abierta).
    const r = await Promise.race([S.u.getIdTokenResult(), new Promise((_, no) => setTimeout(() => no(new Error("lento")), 8000))]);
    tok = { v: r.token, exp: Date.parse(r.expirationTime) };
    return tok.v;
  } catch {
    // En segundo plano, renueva el token por HTTP nativo.
    const r = await Http.request({ method: "POST", url: `https://securetoken.googleapis.com/v1/token?key=${firebaseConfig.apiKey}`,
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, data: { grant_type: "refresh_token", refresh_token: S.u.refreshToken } });
    const d = typeof r.data === "string" ? JSON.parse(r.data) : r.data;
    tok = { v: d.id_token, exp: Date.now() + Number(d.expires_in) * 1000 };
    return tok.v;
  }
}
async function enviarUbicacion(lat, lng, precision, forzar = false) {
  const ahora = Date.now();
  const mov = C.km(ultimoEnvio, { lat, lng }) * 1000;
  if (!forzar && (enviando || (ahora - ultimoEnvio.t < 15000 && mov < 150))) return;
  enviando = true;
  try {
    const campos = { lat: { doubleValue: lat }, lng: { doubleValue: lng }, t: { integerValue: String(ahora) }, enTurno: { booleanValue: true }, nombre: { stringValue: S.perfil?.nombre || "" }, precision: { doubleValue: precision || 0 } };
    if (Http) {
      const mask = Object.keys(campos).map(k => "updateMask.fieldPaths=" + k).join("&");
      const r = await Http.request({ method: "PATCH",
        url: `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/ubicaciones/${S.u.uid}?${mask}`,
        headers: { Authorization: "Bearer " + await token(), "Content-Type": "application/json" }, data: { fields: campos } });
      if (r.status >= 400) throw new Error("HTTP " + r.status);
    } else {
      await setDoc(doc(db, "ubicaciones", S.u.uid), { lat, lng, t: ahora, enTurno: true, nombre: S.perfil?.nombre || "", precision: precision || 0 }, { merge: true });
    }
    ultimoEnvio = { t: ahora, lat, lng };
    S.ultimaSenal = ahora;
  } catch (e) { S.errorSenal = String(e.message || e); }
  enviando = false;
}
async function iniciarTurno(silencioso = false) {
  if (S.turno) return;
  if (!nativo) { toast("La ubicación en segundo plano solo funciona en la app instalada."); return; }
  try { await Notif?.requestPermissions(); } catch {}
  try {
    S.watcher = await BG.addWatcher({
      backgroundTitle: "Mensajería Prueba · en turno",
      backgroundMessage: "Compartiendo tu ubicación con despacho y clientes.",
      requestPermissions: true, stale: false, distanceFilter: 25
    }, (loc, err) => {
      if (err) {
        if (err.code === "NOT_AUTHORIZED") { S.sinPermiso = true; terminarTurno(); ruta(true); }
        return;
      }
      if (!loc) return;
      S.pos = { lat: loc.latitude, lng: loc.longitude, t: loc.time };
      enviarUbicacion(loc.latitude, loc.longitude, loc.accuracy);
      if (location.hash === "#inicio") pintarInicio();
    });
    S.turno = true; S.sinPermiso = false; ls.set("turno", "1");
    await setDoc(doc(db, "ubicaciones", S.u.uid), { enTurno: true, nombre: S.perfil.nombre, inicio: Date.now() }, { merge: true });
    if (!silencioso) toast("Turno iniciado");
  } catch (e) { toast("No se pudo iniciar el turno: " + C.mensajeError(e)); }
  ruta(true);
}
async function terminarTurno() {
  if (S.watcher != null) { try { await BG.removeWatcher({ id: S.watcher }); } catch {} }
  S.watcher = null; S.turno = false; ls.set("turno", "0");
  if (S.u) { try { await setDoc(doc(db, "ubicaciones", S.u.uid), { enTurno: false, fin: Date.now() }, { merge: true }); } catch {} }
  ruta(true);
}

/* ---------- escritura ---------- */
async function guardar(g, cambios) {
  const nueva = { ...g, ...cambios };
  const b = writeBatch(db);
  b.update(doc(db, "guias", g.numero), { ...cambios, actualizado: Date.now() });
  b.set(doc(db, "rastreo", g.numero), C.vistaPublica(nueva));
  await b.commit();
  return nueva;
}
async function tomar(numero) {
  const ref = doc(db, "guias", numero);
  let tomada = null;
  await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error("La guía no existe. Revisa el número.");
    const g = { numero, ...s.data() };
    if (g.mensajeroId && g.mensajeroId !== S.u.uid) throw new Error("Otro mensajero ya tiene este pedido.");
    if (g.estado !== "disponible") throw new Error("Esta guía no está disponible (estado: " + (C.ESTADOS[g.estado] || g.estado) + ").");
    const cambios = { estado: "tomada", mensajeroId: S.u.uid, mensajeroNombre: S.perfil.nombre, mensajeroPlaca: S.perfil.placa || "", eventos: [...(g.eventos || []), C.evento("tomada", "", S.perfil.nombre)], actualizado: Date.now() };
    tx.update(ref, cambios);
    tx.set(doc(db, "rastreo", numero), C.vistaPublica({ ...g, ...cambios }));
    tomada = { ...g, ...cambios, eventosAntes: g.eventos || [] };
  });
  // Al escanear, el pedido sale de una vez "En camino".
  const { eventosAntes, ...g } = tomada;
  return guardar(g, { estado: "en_camino", eventos: [...eventosAntes, C.evento("en_camino", "", S.perfil.nombre)] });
}

/* ---------- rutas ---------- */
addEventListener("hashchange", () => ruta());
let ultimaRuta = "";
function ruta(soloDatos = false) {
  const h = location.hash || "#inicio";
  if (!S.u) { if (h.startsWith("#registro")) pintarRegistro(); else pintarIngreso(); return; }
  if (!S.perfil?.activo) return;
  // Al recibir datos nuevos no redibujar formularios en curso
  if (soloDatos && (h.startsWith("#entregar") || h.startsWith("#novedad") || h.startsWith("#aviso"))) { insignias(); return; }
  if (soloDatos && h === ultimaRuta && h === "#perfil") { insignias(); return; }
  ultimaRuta = h;
  document.querySelectorAll(".barra-abajo a").forEach(a => a.setAttribute("aria-current", h.startsWith("#" + a.dataset.r) || (a.dataset.r === "mios" && /^#(g|entregar|novedad|aviso)\//.test(h)) ? "page" : "false"));
  insignias();
  const [r, n, x] = h.slice(1).split("/");
  if (r === "inicio") pintarInicio();
  else if (r === "disponibles") pintarDisponibles();
  else if (r === "mios") pintarMios();
  else if (r === "perfil") pintarPerfil();
  else if (r === "g") pintarGuia(decodeURIComponent(n));
  else if (r === "entregar") pintarEntregar(decodeURIComponent(n));
  else if (r === "novedad") pintarNovedad(decodeURIComponent(n));
  else location.hash = "#inicio";
}
const zonas = () => (S.perfil?.zonas || []).filter(z => C.NOMBRES_LOCALIDADES.includes(z));
const disponiblesMias = () => S.disp.filter(g => !zonas().length || (g.zonas || []).some(z => zonas().includes(z))).sort((a, b) => a.creado - b.creado);
const activos = () => S.mios.filter(g => ["tomada", "recogida", "en_camino"].includes(g.estado)).sort((a, b) => a.actualizado - b.actualizado);
function insignias() {
  const d = disponiblesMias().length, m = activos().length;
  $("#nDisp").hidden = !d; $("#nDisp").textContent = d;
  $("#nMios").hidden = !m; $("#nMios").textContent = m;
}
function saldo() {
  const ef = S.mios.filter(g => g.estado === "entregada" && g.recaudo?.medio === "efectivo").reduce((s, g) => s + (g.recaudo.valor || 0), 0);
  const ent = S.entregas.reduce((s, e) => s + (e.valor || 0), 0);
  return ef - ent;
}
let mapaG = null;
function limpiarMapa() { if (mapaG) { mapaG.remove(); mapaG = null; } }
function pantalla(html) { limpiarMapa(); $("#raiz").innerHTML = `<section class="pantalla">${html}</section>`; }

/* ---------- ingreso / registro ---------- */
function pantallaMensaje(titulo, texto, salir) {
  $("#barra").hidden = true;
  pantalla(`<h1>Mensajería <span class="marca">Prueba</span></h1><div class="panel"><h2>${esc(titulo)}</h2><p class="nota">${esc(texto)}</p>${salir ? `<button class="btn sec" id="bSalir">Salir</button>` : ""}</div>`);
  if (salir) $("#bSalir").onclick = () => A.signOut(auth);
}
function pintarIngreso() {
  $("#barra").hidden = true;
  pantalla(`<h1>Mensajería <span class="marca">Prueba</span></h1>
    <form class="panel" id="fIng"><h2>Entrar</h2>
      <label>Correo<input id="iCor" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="iCla" type="password" autocomplete="current-password" required></label>
      <button class="btn ancho" type="submit">Entrar</button><div class="error" id="iErr"></div></form>
    <div class="panel"><p class="nota" style="margin:0">¿Primera vez? Necesitas el código de invitación que te envió despacho.</p><a class="btn sec ancho" href="#registro">Crear cuenta con código</a></div>`);
  $("#fIng").onsubmit = async e => {
    e.preventDefault(); $("#iErr").textContent = "";
    try { await A.signInWithEmailAndPassword(auth, $("#iCor").value.trim(), $("#iCla").value); }
    catch (err) { $("#iErr").textContent = C.mensajeError(err); }
  };
}
function chipsZonas(sel = []) {
  return `<div class="btns"><button type="button" class="btn sec chico" data-todas="1">Marcar todas</button><button type="button" class="btn sec chico" data-todas="0">Quitar todas</button></div><div class="chips">${C.NOMBRES_LOCALIDADES.map((z, i) => `<label><input type="checkbox" name="zona" value="${esc(z)}" ${sel.includes(z) ? "checked" : ""}>${esc(z)}</label>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-todas]"); if (!b) return;
  document.querySelectorAll('input[name="zona"]').forEach(i => i.checked = b.dataset.todas === "1");
});
const zonasMarcadas = () => [...document.querySelectorAll('input[name="zona"]:checked')].map(i => i.value);
function pintarRegistro() {
  $("#barra").hidden = true;
  pantalla(`<a class="btn sec chico volver" href="#ingreso">← Volver</a><h1>Crear cuenta</h1>
    <form class="panel" id="fReg">
      <label>Código de invitación<input id="rCod" required autocapitalize="characters" style="font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase"></label>
      <label>Nombre completo<input id="rNom" required autocomplete="name"></label>
      <div class="fila"><label>Cédula<input id="rCed" inputmode="numeric" required></label><label>Celular<input id="rTel" inputmode="tel" required></label></div>
      <label>Placa del vehículo<input id="rPla" autocapitalize="characters" required placeholder="ABC12D"></label>
      <label>Correo<input id="rCor" type="email" required autocomplete="username"></label>
      <label>Contraseña (mínimo 6 caracteres)<input id="rCla" type="password" minlength="6" required autocomplete="new-password"></label>

async function escanear() {
  if (!Escaner) { toast("El escáner solo funciona en la app instalada. Escribe el número de guía."); return null; }
  try {
    const disp = await Escaner.isGoogleBarcodeScannerModuleAvailable().catch(() => ({ available: true }));
    if (disp && disp.available === false) {

      toast("Descargando el escáner de Google. Intenta de nuevo en unos segundos.");
      return null;
    }
    const r = await Escaner.scan({ formats: ["QR_CODE", "CODE_128"] });
    const v = r?.barcodes?.[0]?.rawValue || r?.barcodes?.[0]?.displayValue || "";
    if (!v) return null;
    const n = C.guiaDesdeEscaneo(v);
    if (!n) { toast("Ese código no es una guía de Mensajería Prueba."); return null; }
    return n;
  } catch (e) {
    const m = String(e?.message || e);
    if (/cancel/i.test(m)) return null;
    toast("No se pudo abrir el escáner: " + m); return null;
  }
}

/* ---------- ruta: orden de entregas (se guarda en este celular) ---------- */
const claveOrden = () => "orden:" + (S.u?.uid || "");
function leerOrden() { try { return JSON.parse(ls.get(claveOrden()) || "[]"); } catch { return []; } }
function guardarOrden(nums) { ls.set(claveOrden(), JSON.stringify(nums)); }
// Pedidos en curso en el orden de la ruta; los nuevos van al final.
function enRuta() {
  const l = activos(), orden = leerOrden();
  const pos = n => { const i = orden.indexOf(n); return i < 0 ? 1e9 : i; };
  return l.sort((a, b) => pos(a.numero) - pos(b.numero) || a.actualizado - b.actualizado);
}
// Sugerencia: el más cercano primero y luego se corrigen cruces (2-opt), en línea recta.
function sugerirOrden(lista, inicio) {
  const pts = lista.filter(g => g.destino?.lat != null);
  if (pts.length < 2) return lista.map(g => g.numero);
  let actual = inicio || pts[0].destino, rest = [...pts], ruta = [];
  while (rest.length) {
    let k = 0, d = Infinity;
    rest.forEach((g, i) => { const x = C.km(actual, g.destino); if (x < d) { d = x; k = i; } });
    ruta.push(rest[k]); actual = rest[k].destino; rest.splice(k, 1);
  }
  const largo = r => r.reduce((s, g, i) => s + C.km(i ? r[i - 1].destino : (inicio || r[0].destino), g.destino), 0);
  let mejoro = true, vueltas = 0;
  while (mejoro && vueltas++ < 50) {
    mejoro = false;
    for (let i = 0; i < ruta.length - 1; i++) for (let j = i + 1; j < ruta.length; j++) {
      const nueva = [...ruta.slice(0, i), ...ruta.slice(i, j + 1).reverse(), ...ruta.slice(j + 1)];
      if (largo(nueva) + 1e-9 < largo(ruta)) { ruta = nueva; mejoro = true; }
    }
  }
  const sin = lista.filter(g => g.destino?.lat == null).map(g => g.numero);
  return [...ruta.map(g => g.numero), ...sin];
}
function linkRutaGoogle(l) {
  // Google Maps admite hasta 9 paradas intermedias: se abre la ruta de las primeras 10 entregas.
  const tramo = l.slice(0, 10).map(g => C.direccionTexto(g.destino));
  const destino = tramo.pop();
  let u = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(destino)}`;
  if (S.pos) u += `&origin=${S.pos.lat},${S.pos.lng}`;
  if (tramo.length) u += `&waypoints=${encodeURIComponent(tramo.join("|"))}`;
  return u;
}

  const valor = () => medio() === "pagado" ? 0 : (parseInt(($("#eVal").value || "0").replace(/\D/g, ""), 10) || 0);
  const revisar = () => {
    $("#lVal").hidden = medio() === "pagado";
    $("#lMot").hidden = !(g.valor && valor() !== g.valor);
  };
  document.querySelectorAll('input[name="medio"]').forEach(i => i.onchange = revisar);
  const recibe = () => document.querySelector('input[name="recibe"]:checked')?.value;
  document.querySelectorAll('input[name="recibe"]').forEach(i => i.onchange = () => {
    $("#lRecNom").hidden = recibe() === "cliente";
    $("#tRecNom").textContent = recibe() === "porteria" ? "Nombre del portero o vigilante" : "Nombre y parentesco (ej. Ana, hermana)";
  });
  $("#eVal").oninput = revisar;
  $("#fFoto").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    $("#tFoto").textContent = "Procesando foto…";
    try { foto = await C.comprimirImagen(f); $("#vFoto").src = foto; $("#vFoto").hidden = false; $("#tFoto").textContent = "Cambiar foto"; }
    catch { $("#tFoto").textContent = "No se pudo leer la foto. Intenta de nuevo."; }
  };
  $("#bEnt").onclick = async () => {
    $("#eErr").textContent = "";
    if (!foto) { $("#eErr").textContent = "Toma la foto de entrega antes de confirmar."; return; }
    if (!medio()) { $("#eErr").textContent = "Escoge cómo pagó el cliente."; return; }
    const recNom = $("#eRecNom").value.trim();
    if (recibe() !== "cliente" && !recNom) { $("#eErr").textContent = "Escribe el nombre de quien recibe."; return; }
    const v = valor(), mot = $("#eMot").value.trim();
    if (g.valor && v !== g.valor && !mot) { $("#eErr").textContent = "Escribe por qué el valor recibido es diferente."; return; }
    $("#bEnt").disabled = true; $("#bEnt").textContent = "Guardando…";
    try {
      await setDoc(doc(db, "fotos", n), { imagen: foto, t: Date.now(), mensajeroId: S.u.uid });
      const recaudo = { medio: medio(), valor: v, esperado: g.valor || 0, motivo: mot, recibe: { tipo: recibe(), nombre: recibe() === "cliente" ? g.cliente : recNom } };
      S.ultimaGuia = await guardar(g, { estado: "entregada", recaudo, eventos: [...(g.eventos || []), C.evento("entregada", "", S.perfil.nombre)] });
      toast("Pedido entregado"); location.hash = "#mios";
    } catch (err) { $("#eErr").textContent = C.mensajeError(err); $("#bEnt").disabled = false; $("#bEnt").textContent = "Confirmar entrega"; }
  };
}

/* ---------- novedad ---------- */
function pintarNovedad(n) {
  const g = buscar(n);
  if (!g) { location.hash = "#mios"; return; }
  pantalla(`<a class="btn sec chico volver" href="#g/${esc(n)}">← Volver</a><h1>Novedad en ${esc(n)}</h1>
    <div class="rapidas">${["Cliente no contesta", "Dirección errada", "Cliente no estaba", "Cliente rechazó el pedido", "Paquete dañado"].map(t => `<button data-t="${t}">${t}</button>`).join("")}</div>
    <label>Describe lo que pasó<textarea id="nTxt" required></textarea></label>
    <p class="nota" style="margin:0">Despacho decide si el pedido vuelve a quedar disponible o se devuelve a la tienda.</p>
    <button class="btn btn-turno" id="bNov">Reportar novedad</button><div class="error" id="nErr"></div>`);
  document.querySelector(".rapidas").onclick = e => { const b = e.target.closest("[data-t]"); if (b) $("#nTxt").value = b.dataset.t; };
  $("#bNov").onclick = async () => {
    const t = $("#nTxt").value.trim(); if (!t) { $("#nErr").textContent = "Describe la novedad."; return; }
    $("#bNov").disabled = true;
    try { await guardar(g, { estado: "novedad", eventos: [...(g.eventos || []), C.evento("novedad", t, S.perfil.nombre)] }); toast("Novedad reportada a despacho"); location.hash = "#mios"; }
    catch (err) { $("#nErr").textContent = C.mensajeError(err); $("#bNov").disabled = false; }
  };
}

/* ---------- perfil ---------- */
function pintarPerfil() {
  const p = S.perfil;
  pantalla(`<h1>Perfil</h1>
    <form class="panel" id="fPer">
      <label>Nombre<input id="pNom" value="${esc(p.nombre)}" required></label>
      <div class="fila"><label>Celular<input id="pTel" value="${esc(p.telefono)}"></label><label>Placa<input id="pPla" value="${esc(p.placa)}"></label></div>
      <h3>Zonas donde trabajas</h3>${chipsZonas(p.zonas || [])}
      <button class="btn" type="submit">Guardar cambios</button>
    </form>
    <div class="panel"><h3>Ubicación y batería</h3><p class="nota" style="margin:0">Si tu ubicación se corta con la pantalla apagada, quita el ahorro de batería para esta app y dale permiso de ubicación “todo el tiempo”.</p><button class="btn sec" id="pAj">Abrir ajustes de la app</button></div>
    <div class="panel"><dl class="kv"><dt>Correo</dt><dd>${esc(p.email)}</dd><dt>Cédula</dt><dd>${esc(p.cedula)}</dd></dl><button class="btn peligro" id="pSalir">Cerrar sesión</button></div>`);
  $("#pAj").onclick = () => BG?.openSettings();
  $("#pSalir").onclick = async () => { await terminarTurno(); A.signOut(auth); };
  $("#fPer").onsubmit = async e => {
    e.preventDefault();
    try {
      const cambios = { nombre: $("#pNom").value.trim(), telefono: $("#pTel").value.trim(), placa: $("#pPla").value.trim().toUpperCase(), zonas: zonasMarcadas() };
      await F.updateDoc(doc(db, "usuarios", S.u.uid), cambios); toast("Perfil guardado");
    } catch (err) { toast(C.mensajeError(err)); }
  };
}
setInterval(() => { if (S.u && location.hash === "#inicio") pintarInicio(); }, 30000);
</script>
</body>
