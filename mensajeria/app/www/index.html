<script>
  // Si algo falla al arrancar, mostrarlo en pantalla en vez de quedarse cargando.
  function mostrarFallo(t) {
    var el = document.getElementById("cargando");
    if (el) el.innerHTML = '<div style="max-width:420px;padding:16px;text-align:center"><b>No se pudo abrir la app.</b><br><span style="font-size:13px">' + String(t).replace(/</g, "&lt;") + '</span><br><br><button class="btn" onclick="location.reload()">Reintentar</button></div>';
  }
  window.addEventListener("error", function (e) { mostrarFallo(e.message || "Error desconocido"); });
  window.addEventListener("unhandledrejection", function (e) { mostrarFallo((e.reason && e.reason.message) || e.reason || "Error desconocido"); });
  setTimeout(function () { if (document.getElementById("cargando")) mostrarFallo("La app tarda demasiado en cargar. Revisa que el celular tenga internet."); }, 20000);
</script>

<script type="module">
import { firebaseConfig, FIREBASE_VERSION } from "./config.js?v=20261112w";
import * as C from "./comun.js?v=20261112w";
const V = FIREBASE_VERSION;
const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
const { getFirestore, initializeFirestore, persistentLocalCache, waitForPendingWrites, doc, getDoc, getDocs, setDoc, onSnapshot, collection, query, where, limit, writeBatch, runTransaction } = F;

const app = initializeApp(firebaseConfig);
const auth = A.initializeAuth(app, { persistence: [A.indexedDBLocalPersistence, A.browserLocalPersistence] });
// Caché en el celular: sin señal, los pedidos se siguen viendo y las entregas quedan
// guardadas para enviarse solas cuando vuelva la conexión.
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache() }); } catch { db = getFirestore(app); }
const $ = s => document.querySelector(s);
const { esc } = C;

/* ---------- plugins nativos ---------- */
const Cap = window.Capacitor;
const nativo = !!(Cap && Cap.isNativePlatform && Cap.isNativePlatform());
const registrar = window.capacitorExports?.registerPlugin;
const BG = nativo && registrar ? registrar("BackgroundGeolocation") : null;
const Http = nativo && registrar ? registrar("CapacitorHttp") : null;
const Notif = nativo && registrar ? registrar("LocalNotifications") : null;
const Escaner = nativo && registrar ? registrar("BarcodeScanner") : null;
const Perm = nativo && registrar ? registrar("Permisos") : null;

/* ---------- estado ---------- */
const S = { u: null, perfil: null, disp: [], mios: [], entregas: [], pos: null, turno: false, watcher: null };
let subs = [];
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

/* ---------- sin señal ---------- */
let porEnviar = 0;
function pintarSenal() {
  const el = $("#senal");
  if (porEnviar > 0) { el.textContent = navigator.onLine ? "Enviando cambios guardados en el celular…" : `Sin señal · ${porEnviar} cambio${porEnviar === 1 ? "" : "s"} guardado${porEnviar === 1 ? "" : "s"} en el celular. Se envían solos al volver la señal.`; el.hidden = false; }
  else if (!navigator.onLine) { el.textContent = "Sin señal. Puedes seguir entregando; los cambios se envían solos al volver la conexión."; el.hidden = false; }
  else el.hidden = true;
}
addEventListener("online", pintarSenal); addEventListener("offline", pintarSenal); pintarSenal();
// Espera a que el servidor confirme; si no hay señal, deja el cambio en cola y sigue.
async function enviar(p) {
  const tarde = e => toast("Un cambio no se pudo guardar: " + C.mensajeError(e));
  let t;
  const r = navigator.onLine
    ? await Promise.race([p.then(() => "ok"), new Promise(ok => t = setTimeout(() => ok("pendiente"), 6000))])
    : "pendiente";
  clearTimeout(t);
  if (r === "pendiente") {
    p.catch(tarde);
    porEnviar++; pintarSenal();
    waitForPendingWrites(db).then(() => { if (porEnviar) { porEnviar = 0; pintarSenal(); toast("Cambios enviados a despacho"); } }).catch(() => {});
  }
  return r;
}
const msgGuardado = (pend, ok) => pend ? "Guardado en el celular: se envía al volver la señal" : ok;

function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => el.hidden = true, 2800); }
function abrirExterno(url) { window.location.href = url; }

/* ---------- sesión ---------- */
A.onAuthStateChanged(auth, async user => {
  subs.forEach(f => f()); subs = [];
  S.u = user; S.perfil = null;
  if (!user) { $("#barra").hidden = true; if (!location.hash.startsWith("#registro")) location.hash = "#ingreso"; ruta(); return; }
  try {
    const p = await getDoc(doc(db, "usuarios", user.uid));
    if (!p.exists()) { if (S.registrando) return; pantallaMensaje("Tu cuenta no tiene perfil de mensajero", "Pídele a despacho un código de invitación y crea la cuenta desde “Crear cuenta”.", true); return; }
    S.perfil = p.data();
    if (S.perfil.rol !== "mensajero") { pantallaMensaje("Esta cuenta es de despacho", "La app es solo para mensajeros. Despacho usa el panel web.", true); return; }
    if (!S.perfil.activo) { pantallaMensaje("Tu cuenta está desactivada", "Habla con despacho para volver a activarla.", true); return; }
  } catch (e) { pantallaMensaje("No se pudo cargar tu perfil", C.mensajeError(e), true); return; }
  escuchar();
  $("#barra").hidden = false;
  if (!location.hash || ["#ingreso", "#registro"].includes(location.hash)) location.hash = "#inicio";
  if (ls.get("turno") === "1") {
    if ((S.perfil.finTurno || 0) > (Number(ls.get("inicioTurno")) || 0)) { ls.set("turno", "0"); toast("Despacho terminó tu turno mientras la app estaba cerrada."); }
    else iniciarTurno(true);
  }
  ruta();
  // Recién instalada o con permisos pendientes: mostrar la pantalla de permisos
  if (await revisarPermisos()) { if (faltantes().some(p => p.clave)) location.hash = "#permisos"; else ruta(true); }
});
function escuchar() {
  const uid = S.u.uid;
  subs.push(onSnapshot(doc(db, "usuarios", uid), s => { if (s.exists()) { S.perfil = s.data(); if (!S.perfil.activo) { terminarTurno(); A.signOut(auth); } else if (desconectadoPorDespacho()) finPorDespacho(); } }));
  subs.push(onSnapshot(query(collection(db, "guias"), where("mensajeroId", "==", uid)), s => { S.mios = s.docs.map(d => ({ numero: d.id, ...d.data() })); ruta(true); }, e => toast(C.mensajeError(e))));
  subs.push(onSnapshot(query(collection(db, "entregasDinero"), where("mensajeroId", "==", uid)), s => { S.entregas = s.docs.map(d => d.data()); ruta(true); }, () => {}));
}

/* ---------- ubicación en segundo plano ---------- */
let tok = { v: null, exp: 0 }, ultimoEnvio = { t: 0, lat: 0, lng: 0 }, enviando = 0;
// Ninguna petición puede quedarse colgada: si no responde, se abandona y se reintenta.
const conLimite = (p, ms, que) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error(que + " sin respuesta")), ms))]);
async function token() {
  if (tok.v && Date.now() < tok.exp - 5 * 60000) return tok.v;
  try {
    // Primero intenta el SDK (funciona con la app abierta).
    const r = await Promise.race([S.u.getIdTokenResult(), new Promise((_, no) => setTimeout(() => no(new Error("lento")), 8000))]);
    tok = { v: r.token, exp: Date.parse(r.expirationTime) };
    return tok.v;
  } catch {
    // En segundo plano, renueva el token por HTTP nativo.
    const r = await conLimite(Http.request({ method: "POST", url: `https://securetoken.googleapis.com/v1/token?key=${firebaseConfig.apiKey}`,
      headers: { "Content-Type": "application/x-www-form-urlencoded" }, data: { grant_type: "refresh_token", refresh_token: S.u.refreshToken } }), 15000, "renovar sesión");
    const d = typeof r.data === "string" ? JSON.parse(r.data) : r.data;
    tok = { v: d.id_token, exp: Date.now() + Number(d.expires_in) * 1000 };
    return tok.v;
  }
}
async function enviarUbicacion(lat, lng, precision, forzar = false) {
  const ahora = Date.now();
  const mov = C.km(ultimoEnvio, { lat, lng }) * 1000;
  // Se envía si se movió 50 m (cada 15 s como máximo) o, quieto, cada minuto para que despacho vea que sigue activo.
  if (enviando && ahora - enviando < 30000) return;
  if (!forzar && !((mov >= 50 && ahora - ultimoEnvio.t >= 15000) || ahora - ultimoEnvio.t >= 60000)) return;
  enviando = ahora;
  try {
    const campos = { lat: { doubleValue: lat }, lng: { doubleValue: lng }, t: { integerValue: String(ahora) }, enTurno: { booleanValue: true }, nombre: { stringValue: S.perfil?.nombre || "" }, precision: { doubleValue: precision || 0 } };
    if (Http) {
      const mask = Object.keys(campos).map(k => "updateMask.fieldPaths=" + k).join("&");
      const r = await conLimite(Http.request({ method: "PATCH",
        url: `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/ubicaciones/${S.u.uid}?${mask}`,
        headers: { Authorization: "Bearer " + await token(), "Content-Type": "application/json" }, data: { fields: campos } }), 20000, "servidor");
      if (r.status === 401 || r.status === 403) tok = { v: null, exp: 0 }; // sesión vencida: renovar en el próximo envío
      if (r.status >= 400) throw new Error("HTTP " + r.status);
    } else {
      await setDoc(doc(db, "ubicaciones", S.u.uid), { lat, lng, t: ahora, enTurno: true, nombre: S.perfil?.nombre || "", precision: precision || 0 }, { merge: true });
    }
    ultimoEnvio = { t: ahora, lat, lng };
    S.ultimaSenal = ahora; S.errorSenal = "";
  } catch (e) { S.errorSenal = String(e.message || e); }
  enviando = 0;
  revisarDesconexion();
}
// Despacho puede terminar el turno desde el panel (campo finTurno del perfil).
// En segundo plano el listener puede dormirse, así que cada 5 minutos se consulta por HTTP.
let ultimaRevisionFin = 0;
const desconectadoPorDespacho = (fin = S.perfil?.finTurno) => !!S.turno && (fin || 0) > (S.inicioTurno || 0);
async function revisarDesconexion() {
  if (!S.turno || !Http || Date.now() - ultimaRevisionFin < 5 * 60000) return;
  ultimaRevisionFin = Date.now();
  try {
    const r = await conLimite(Http.request({ method: "GET",
      url: `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/usuarios/${S.u.uid}?mask.fieldPaths=finTurno`,
      headers: { Authorization: "Bearer " + await token() } }), 15000, "servidor");
    const d = typeof r.data === "string" ? JSON.parse(r.data) : r.data;
    const fin = Number(d?.fields?.finTurno?.integerValue || d?.fields?.finTurno?.doubleValue || 0);
    if (desconectadoPorDespacho(fin)) finPorDespacho();
  } catch {}
}
function finPorDespacho() {
  terminarTurno();
  toast("Despacho terminó tu turno. Si sigues trabajando, inicia turno otra vez.");
  try { Notif?.schedule({ notifications: [{ id: 7, title: "Turno terminado por despacho", body: "Si sigues trabajando, abre la app e inicia turno otra vez." }] }); } catch {}
}
async function iniciarTurno(silencioso = false) {
  if (S.turno) return;
  if (!nativo) { toast("La ubicación en segundo plano solo funciona en la app instalada."); return; }
  if (!silencioso && Perm) {
    await revisarPermisos();
    const f = faltantes().filter(p => p.clave);
    if (f.length) { location.hash = "#permisos"; toast("Antes de iniciar turno activa: " + f.map(p => p.t).join(", ")); await activarTodo(); }
  }
  try { await Notif?.requestPermissions(); } catch {}
  try {
    S.watcher = await BG.addWatcher({
      backgroundTitle: "Mensajería Prueba · en turno",
      backgroundMessage: "Compartiendo tu ubicación con despacho y clientes.",
      requestPermissions: true, stale: false, distanceFilter: 0
    }, (loc, err) => {
      if (err) {
        if (err.code === "NOT_AUTHORIZED") { S.sinPermiso = true; terminarTurno(); ruta(true); }
        return;
      }
      if (!loc) return;
      S.pos = { lat: loc.latitude, lng: loc.longitude, t: loc.time };
      enviarUbicacion(loc.latitude, loc.longitude, loc.accuracy);
      if (location.hash === "#inicio") pintarInicio();
    });
    S.turno = true; S.sinPermiso = false; ls.set("turno", "1");

/* ---------- escritura ---------- */
async function guardar(g, cambios, foto, extras) {
  const nueva = { ...g, ...cambios };
  const b = writeBatch(db);
  b.update(doc(db, "guias", g.numero), { ...cambios, actualizado: Date.now() });
  // El rastreo vive en "NUMERO_CLAVE": solo lo ve quien tiene el código secreto.
  if (g.clave) b.set(doc(db, "rastreo", C.idRastreo(g)), C.vistaPublica(nueva, foto, extras), { merge: true });
  nueva.pendiente = (await enviar(b.commit())) === "pendiente";
  return nueva;
}
async function tomar(numero) {
  const ref = doc(db, "guias", numero);
  let tomada = null;
  await runTransaction(db, async tx => {
    const s = await tx.get(ref);
    if (!s.exists()) throw new Error("La guía no existe. Revisa el número.");
    const g = { numero, ...s.data() };
    if (g.mensajeroId && g.mensajeroId !== S.u.uid) throw new Error("Otro mensajero ya tiene este pedido.");
    if (g.estado !== "disponible") throw new Error("Esta guía no está disponible (estado: " + (C.ESTADOS[g.estado] || g.estado) + ").");
    const cambios = { estado: "tomada", mensajeroId: S.u.uid, mensajeroNombre: S.perfil.nombre, mensajeroPlaca: S.perfil.placa || "", eventos: [...(g.eventos || []), C.evento("tomada", "", S.perfil.nombre)], actualizado: Date.now() };
    tx.update(ref, cambios);
    if (g.clave) tx.set(doc(db, "rastreo", C.idRastreo(g)), C.vistaPublica({ ...g, ...cambios }), { merge: true });
    tomada = { ...g, ...cambios, eventosAntes: g.eventos || [] };
  });
  // Al escanear, el pedido queda "Recogido" a nombre del mensajero.
  const { eventosAntes, ...g } = tomada;
  return guardar(g, { estado: "recogida", eventos: [...eventosAntes, C.evento("recogida", "", S.perfil.nombre)] });
}

async function escanear() {
  if (!Escaner) { toast("El escáner solo funciona en la app instalada. Escribe el número de guía."); return null; }
  try {
    const disp = await Escaner.isGoogleBarcodeScannerModuleAvailable().catch(() => ({ available: true }));
    if (disp && disp.available === false) {
      await Escaner.installGoogleBarcodeScannerModule();
      toast("Descargando el escáner de Google. Intenta de nuevo en unos segundos.");
      return null;
    }
    const r = await Escaner.scan({ formats: ["QR_CODE", "CODE_128"] });
    const v = r?.barcodes?.[0]?.rawValue || r?.barcodes?.[0]?.displayValue || "";
    if (!v) return null;
    const n = C.guiaDesdeEscaneo(v);
    if (!n) { toast("Ese código no es una guía de Mensajería Prueba."); return null; }
    return n;
  } catch (e) {
    const m = String(e?.message || e);
    if (/cancel/i.test(m)) return null;
    toast("No se pudo abrir el escáner: " + m); return null;
  }
}
// Recibe una guía: queda "Recogida" a nombre del mensajero. Devuelve { ok, msg }.
async function recibirGuia(n) {
  n = C.guiaDesdeEscaneo(n) || String(n || "").trim().toUpperCase();
  if (!C.esNumeroGuia(n)) return { ok: false, msg: "Escribe el número completo, por ejemplo PIPEGAMES-00001." };
  const ya = buscar(n);
  if (ya && ["tomada", "recogida"].includes(ya.estado)) return { ok: true, msg: n + " ya estaba recogida", repetida: true };
  if (ya?.estado === "en_camino") return { ok: false, msg: n + " ya va en camino" };
  if (ya?.estado === "entregada") return { ok: false, msg: n + " ya la entregaste" };
  try { S.ultimaGuia = await tomar(n); return { ok: true, msg: n + " recogida" }; }
  catch (err) { return { ok: false, msg: /^(Otro|La guía|Esta guía)/.test(err.message || "") ? n + ": " + err.message : !navigator.onLine ? "Sin señal: para recibir una guía necesitas conexión." : C.mensajeError(err) }; }
}

const ESC = { activo: false, vistos: new Map(), cuenta: 0 };

async function iniciarEscaneo() {

// Número de guía a partir de lo leído: nuestra guía, o el QR / número de envío de Mercado Libre
async function resolverCodigo(v) {
  const n = C.guiaDesdeEscaneo(v);
  if (n) return { n };
  const envio = C.envioMLDesdeEscaneo(v);
  if (!envio) return null;
  const local = S.mios.find(g => g.marketplace?.envio === envio);
  if (local) return { n: local.numero, envio };
  const q = await getDocs(query(collection(db, "guias"), where("marketplace.envio", "==", envio), limit(1)));
  if (q.empty) return { error: `La etiqueta ${envio} (Mercado Libre o Falabella) no tiene guía. Pide a despacho que cargue la etiqueta.`, envio };
  return { n: q.docs[0].id, envio };
}
async function procesarCodigo(v) {
  if (!ESC.activo) return;
  const clave = C.guiaDesdeEscaneo(v) || (C.envioMLDesdeEscaneo(v) ? "ML:" + C.envioMLDesdeEscaneo(v) : null);
  if (!clave) { escMsg("Ese código no es una guía de Mensajería Prueba, Mercado Libre ni Falabella.", "mal"); return; }
  const antes = ESC.vistos.get(clave);
  if (antes === "ok" || antes === "procesando") return;            // ya leída: no repetir
  if (typeof antes === "number" && Date.now() - antes < 4000) return; // falló hace poco: esperar antes de reintentar
  ESC.vistos.set(clave, "procesando");
  escMsg("Recibiendo…");
  let n = null;
  try { const res = await resolverCodigo(v); if (res?.error) { ESC.vistos.set(clave, Date.now()); escMsg("✗ " + res.error, "mal"); return; } n = res?.n; } catch (e) { ESC.vistos.set(clave, Date.now()); escMsg("✗ " + C.mensajeError(e), "mal"); return; }
  const r = await recibirGuia(n);
  if (r.ok) {
    ESC.vistos.set(clave, "ok");
    if (!r.repetida) ESC.cuenta++;
    $("#escCuenta").textContent = ESC.cuenta + (ESC.cuenta === 1 ? " guía recogida" : " guías recogidas");
    escMsg("✓ " + r.msg, "ok");
    try { navigator.vibrate?.(120); } catch {}
  } else {
    ESC.vistos.set(clave, Date.now());
    escMsg("✗ " + r.msg, "mal");
    try { navigator.vibrate?.([80, 60, 80]); } catch {}
  }
}

/* ---------- ruta: orden de entregas (se guarda en este celular) ---------- */
const claveOrden = () => "orden:" + (S.u?.uid || "");
function leerOrden() { try { return JSON.parse(ls.get(claveOrden()) || "[]"); } catch { return []; } }
function guardarOrden(nums) { ls.set(claveOrden(), JSON.stringify(nums)); }
// Pedidos en curso en el orden de la ruta; los nuevos van al final.
function enRuta() {
  const l = S.mios.filter(g => g.estado === "en_camino"), orden = leerOrden();
  const pos = n => { const i = orden.indexOf(n); return i < 0 ? 1e9 : i; };
  return l.sort((a, b) => pos(a.numero) - pos(b.numero) || a.actualizado - b.actualizado);
}
// Sugerencia: el más cercano primero y luego se corrigen cruces (2-opt), en línea recta.
function sugerirOrden(lista, inicio) {
  const pts = lista.filter(g => g.destino?.lat != null);
  if (pts.length < 2) return lista.map(g => g.numero);
  let actual = inicio || pts[0].destino, rest = [...pts], ruta = [];
  while (rest.length) {
    let k = 0, d = Infinity;
    rest.forEach((g, i) => { const x = C.km(actual, g.destino); if (x < d) { d = x; k = i; } });
    ruta.push(rest[k]); actual = rest[k].destino; rest.splice(k, 1);
  }
  const largo = r => r.reduce((s, g, i) => s + C.km(i ? r[i - 1].destino : (inicio || r[0].destino), g.destino), 0);
  let mejoro = true, vueltas = 0;
  while (mejoro && vueltas++ < 50) {
    mejoro = false;
    for (let i = 0; i < ruta.length - 1; i++) for (let j = i + 1; j < ruta.length; j++) {
      const nueva = [...ruta.slice(0, i), ...ruta.slice(i, j + 1).reverse(), ...ruta.slice(j + 1)];
      if (largo(nueva) + 1e-9 < largo(ruta)) { ruta = nueva; mejoro = true; }
    }
  }
  const sin = lista.filter(g => g.destino?.lat == null).map(g => g.numero);
  return [...ruta.map(g => g.numero), ...sin];
}

  if (tramo.length) u += `&waypoints=${encodeURIComponent(tramo.join("|"))}`;
  return u;
}

      </div>
    </div>
    <button class="btn btn-turno ok" id="bEnt">Confirmar entrega</button>
    <div class="error" id="eErr"></div>`);
  const medio = () => document.querySelector('input[name="medio"]:checked')?.value;
  const valor = () => medio() === "pagado" ? 0 : (parseInt(($("#eVal").value || "0").replace(/\D/g, ""), 10) || 0);
  let comp = null;
  const revisar = () => {
    $("#cajaComp").hidden = medio() !== "nequi";
    $("#lVal").hidden = medio() === "pagado";
    $("#lMot").hidden = !(g.valor && valor() !== g.valor);
  };
  document.querySelectorAll('input[name="medio"]').forEach(i => i.onchange = revisar);
  const recibe = () => document.querySelector('input[name="recibe"]:checked')?.value;
  document.querySelectorAll('input[name="recibe"]').forEach(i => i.onchange = () => {
    $("#lRecNom").hidden = recibe() === "cliente";
    $("#tRecNom").textContent = recibe() === "porteria" ? "Nombre del portero o vigilante" : "Nombre y parentesco (ej. Ana, hermana)";
  });
  $("#eVal").oninput = revisar;
  const pintarFotos = () => {
    $("#vFotos").innerHTML = fotos.map((f, i) => `<div><img src="${f}" alt="Foto ${i + 1} de la entrega"><button type="button" data-quitar="${i}" aria-label="Quitar foto ${i + 1}">✕</button></div>`).join("");
    document.querySelectorAll(".foto-opc")[0].classList.toggle("lleno", fotos.length >= MAX_FOTOS);
    $("#tFoto").textContent = !fotos.length ? "Toma o elige al menos 1 foto. Puedes agregar hasta 3."
      : fotos.length >= MAX_FOTOS ? "3 fotos listas (máximo). Toca ✕ para quitar una."
      : `${fotos.length} foto${fotos.length === 1 ? "" : "s"} lista${fotos.length === 1 ? "" : "s"}. Puedes agregar ${MAX_FOTOS - fotos.length} más o confirmar la entrega.`;
  };
  $("#vFotos").onclick = e => { const b = e.target.closest("[data-quitar]"); if (!b) return; fotos.splice(Number(b.dataset.quitar), 1); pintarFotos(); };
  $("#fFotoG").onchange = e => $("#fFoto").onchange(e);
  $("#fCompG").onchange = e => $("#fComp").onchange(e);
  $("#fFoto").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    $("#tFoto").textContent = "Procesando foto…";
    const lista = [...(e.target.files || [])], libres = MAX_FOTOS - fotos.length;
    let fallo = false;
    for (const archivo of lista.slice(0, libres)) { try { fotos.push(await C.comprimirImagen(archivo)); } catch { fallo = true; } }
    e.target.value = "";
    pintarFotos();
    if (lista.length > libres) toast(libres === 1 ? `Solo se agregó 1: el máximo es ${MAX_FOTOS} fotos` : `Solo se agregaron ${libres}: el máximo es ${MAX_FOTOS} fotos`);
    if (fallo) $("#tFoto").textContent = "Alguna foto no se pudo leer. Intenta de nuevo.";
  };
  $("#fComp").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    $("#tComp").textContent = "Procesando foto…";
    try { comp = await C.comprimirImagen(f); $("#vComp").src = comp; $("#vComp").hidden = false; $("#tComp").textContent = "Comprobante listo. Puedes cambiarlo con los botones de arriba."; }
    catch { $("#tComp").textContent = "No se pudo leer la foto. Intenta de nuevo."; }
  };
  $("#bEnt").onclick = async () => {
    $("#eErr").textContent = "";
    if (!fotos.length) { $("#eErr").textContent = "Toma o elige al menos 1 foto de la entrega antes de confirmar."; return; }
    if (!medio()) { $("#eErr").textContent = "Escoge cómo pagó el cliente."; return; }
    if (medio() === "nequi" && !comp) { $("#eErr").textContent = "Toma o elige la foto del comprobante de Nequi."; return; }
    const recNom = $("#eRecNom").value.trim();
    if (recibe() !== "cliente" && !recNom) { $("#eErr").textContent = "Escribe el nombre de quien recibe."; return; }
    const v = valor(), mot = $("#eMot").value.trim();
    if (g.valor && v !== g.valor && !mot) { $("#eErr").textContent = "Escribe por qué el valor recibido es diferente."; return; }
    $("#bEnt").disabled = true; $("#bEnt").textContent = "Guardando…";
    try {
      await enviar(setDoc(doc(db, "fotos", n), { imagen: fotos[0], extras: fotos.slice(1), tipo: "entrega", t: Date.now(), mensajeroId: S.u.uid, ...(medio() === "nequi" && comp ? { comprobante: comp } : {}) }));
      const recaudo = { medio: medio(), valor: v, esperado: g.valor || 0, motivo: mot, recibe: { tipo: recibe(), nombre: recibe() === "cliente" ? g.cliente : recNom } };
      S.ultimaGuia = await guardar(g, { estado: "entregada", recaudo, eventos: [...(g.eventos || []), C.evento("entregada", "", S.perfil.nombre)] }, fotos[0], fotos.slice(1));
      toast(msgGuardado(S.ultimaGuia.pendiente, "Pedido entregado")); location.hash = "#mios";
    } catch (err) { $("#eErr").textContent = C.mensajeError(err); $("#bEnt").disabled = false; $("#bEnt").textContent = "Confirmar entrega"; }
  };
}

/* ---------- novedad ---------- */
function pintarNovedad(n) {
  const g = buscar(n);
  if (!g) { location.hash = "#mios"; return; }
  pantalla(`<a class="btn sec chico volver" href="#g/${esc(n)}">← Volver</a><h1>Novedad en ${esc(n)}</h1>
    <div class="rapidas">${["Cliente no contesta", "Dirección errada", "Cliente no estaba", "Cliente rechazó el pedido", "Paquete dañado"].map(t => `<button data-t="${t}">${t}</button>`).join("")}</div>
    <label>Describe lo que pasó<textarea id="nTxt" required></textarea></label>
    <label class="foto-btn"><input type="file" accept="image/*" capture="environment" id="nFoto"><span id="tNFoto">Tomar foto de la novedad (opcional)</span></label>
    <img class="foto-entrega" id="vNFoto" alt="Foto de la novedad" hidden>
    <p class="nota" style="margin:0">Despacho decide si el pedido vuelve a quedar disponible o se devuelve a la tienda.</p>
    <button class="btn btn-turno" id="bNov">Reportar novedad</button><div class="error" id="nErr"></div>`);
  document.querySelector(".rapidas").onclick = e => { const b = e.target.closest("[data-t]"); if (b) $("#nTxt").value = b.dataset.t; };
  let fotoNov = null;
  $("#nFoto").onchange = async e => {
    const f = e.target.files?.[0]; if (!f) return;
    $("#tNFoto").textContent = "Procesando foto…";
    try { fotoNov = await C.comprimirImagen(f); $("#vNFoto").src = fotoNov; $("#vNFoto").hidden = false; $("#tNFoto").textContent = "Cambiar foto"; }
    catch { $("#tNFoto").textContent = "No se pudo leer la foto. Intenta de nuevo."; }
  };
  $("#bNov").onclick = async () => {
    const t = $("#nTxt").value.trim(); if (!t) { $("#nErr").textContent = "Describe la novedad."; return; }
    $("#bNov").disabled = true;
    try {
      if (fotoNov) await enviar(setDoc(doc(db, "fotos", n), { imagen: fotoNov, tipo: "novedad", t: Date.now(), mensajeroId: S.u.uid }));
      const r = await guardar(g, { estado: "novedad", eventos: [...(g.eventos || []), C.evento("novedad", t, S.perfil.nombre)] }); toast(msgGuardado(r.pendiente, "Novedad reportada a despacho")); location.hash = "#mios";
    }
    catch (err) { $("#nErr").textContent = C.mensajeError(err); $("#bNov").disabled = false; }
  };
}

/* ---------- perfil ---------- */
function pintarPerfil() {
  const p = S.perfil;
  pantalla(`<h1>Perfil</h1>
    <form class="panel" id="fPer">
      <label>Nombre<input id="pNom" value="${esc(p.nombre)}" required></label>
      <div class="fila"><label>Celular<input id="pTel" value="${esc(p.telefono)}"></label><label>Placa<input id="pPla" value="${esc(p.placa)}"></label></div>
      <button class="btn" type="submit">Guardar cambios</button>
    </form>
    <div class="panel"><h3>Ubicación y batería</h3><p class="nota" style="margin:0">Si tu ubicación se corta con la pantalla apagada, quita el ahorro de batería para esta app y dale permiso de ubicación “todo el tiempo”.</p><div class="btns">${Perm ? `<button class="btn" id="pPerm">Revisar permisos del celular</button>` : ""}<button class="btn sec" id="pAj">Abrir ajustes de la app</button></div></div>
    <div class="panel"><dl class="kv"><dt>Correo</dt><dd>${esc(p.email)}</dd><dt>Cédula</dt><dd>${esc(p.cedula)}</dd></dl><button class="btn peligro" id="pSalir">Cerrar sesión</button></div>`);
  $("#pAj").onclick = () => BG?.openSettings();
  $("#pPerm") && ($("#pPerm").onclick = () => location.hash = "#permisos");
  $("#pSalir").onclick = async () => { await terminarTurno(); A.signOut(auth); };
  $("#fPer").onsubmit = async e => {
    e.preventDefault();
    try {
      const cambios = { nombre: $("#pNom").value.trim(), telefono: $("#pTel").value.trim(), placa: $("#pPla").value.trim().toUpperCase() };
      await F.updateDoc(doc(db, "usuarios", S.u.uid), cambios); toast("Perfil guardado");
    } catch (err) { toast(C.mensajeError(err)); }
  };
}
setInterval(() => { if (S.u && location.hash === "#inicio") pintarInicio(); }, 30000);
</script>
</body>
